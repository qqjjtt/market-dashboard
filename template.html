<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A 股盘后看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap">
<style>
  :root {
    --bg: #ffffff; --surface: #f4f4f2; --ink: #1f2b4d; --muted: #646b81;
    --hair: color-mix(in oklab, var(--ink) 12%, transparent);
    --up: #c8402f; --down: #1f8a5b; --cold: #2f5d8a; --warm: #b8651a;
    --z0: #b5452f; --z1: #d08a4a; --z2: #9aa0ae; --z3: #5b86b0; --z4: #2f5d8a;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: auto; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Geist", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 15px; line-height: 1.55;
  }
  a { color: inherit; }
  a:focus-visible, button:focus-visible, summary:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .tnum, table, .tiles .v, .kv, .idx-strip .v { font-variant-numeric: tabular-nums; }
  .up { color: var(--up); } .down { color: var(--down); } .flat, .muted { color: var(--muted); }
  .t-red { --tone: var(--up); } .t-orange { --tone: var(--warm); } .t-blue { --tone: var(--cold); }
  .t-green { --tone: var(--down); } .t-gray { --tone: var(--muted); }

  #demo-banner { display: none; background: var(--ink); color: #fff; text-align: center; padding: 6px 12px; font-size: 13px; font-weight: 600; }

  /* top bar */
  header.top { position: sticky; top: 0; z-index: 10; background: color-mix(in oklab, var(--bg) 94%, transparent);
               backdrop-filter: blur(6px); border-bottom: 1px solid var(--hair); }
  .bar { max-width: 1240px; margin: 0 auto; padding: 12px 20px 0; }
  .brand { display: flex; align-items: baseline; gap: 4px 14px; flex-wrap: wrap; }
  .brand h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .brand .meta { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav a { flex: none; padding: 8px 14px 10px; color: var(--muted); text-decoration: none; font-weight: 550; font-size: 15px;
          border-bottom: 2px solid transparent; white-space: nowrap; }
  nav a:hover { color: var(--ink); }
  nav a.on { color: var(--ink); border-bottom-color: var(--ink); }
  nav a .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-left: 6px; vertical-align: 2px; background: var(--tone, var(--muted)); }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px 40px; }
  .page { display: none; } .page.on { display: block; }

  /* generic card */
  .card { background: var(--bg); border: 1px solid var(--hair); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; line-height: 1.5; padding: 1px 9px; border-radius: 999px;
           color: var(--tone, var(--muted)); background: color-mix(in oklab, var(--tone, var(--muted)) 10%, #fff);
           border: 1px solid color-mix(in oklab, var(--tone, var(--muted)) 28%, #fff); white-space: nowrap; }
  .empty-note { color: var(--muted); padding: 14px 4px; text-align: center; }
  .chart-msg { color: var(--muted); text-align: center; padding: 40px 0; }
  .note { font-size: 13px; color: var(--muted); }

  /* asset strip */
  .asset-card { margin-top: 16px; padding: 12px 8px; }
  .asset-head { color: var(--muted); font-size: 13px; padding: 0 10px 8px; }
  .asset-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px 0; }
  .asset { padding: 4px 12px; border-right: 1px solid var(--hair); min-width: 0; }
  .asset:last-child { border-right: 0; }
  .asset .n { color: var(--muted); font-size: 12px; }
  .asset .v { font-size: 19px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .asset .c { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .asset .c i { font-style: normal; color: var(--muted); font-weight: 400; margin-right: 6px; }
  .asset .d { display: inline-block; margin-top: 2px; padding: 0 7px; border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 12px; line-height: 18px; }
  .asset .nt { color: var(--muted); font-size: 11.5px; margin-top: 2px; }
  @media (max-width: 900px) { .asset-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .asset:nth-child(3n) { border-right: 0; } }
  @media (max-width: 480px) { .asset-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .asset:nth-child(3n) { border-right: 1px solid var(--hair); } .asset:nth-child(2n) { border-right: 0; } }

  /* section headings */
  .sec-title { font-size: 16px; font-weight: 650; margin: 28px 0 10px; display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
  .sec-title small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .sec-title .ctl { margin-left: auto; }

  /* segmented toggle */
  .seg { display: inline-flex; background: var(--surface); border-radius: 6px; padding: 2px; gap: 2px; }
  .seg button { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted); padding: 4px 12px; border-radius: 4px; cursor: pointer; }
  .seg button[aria-selected="true"] { background: var(--bg); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--hair); }

  /* index strip */
  .idx-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px 0; padding: 8px 4px; margin-top: 16px; }
  .idx { padding: 6px 14px; border-right: 1px solid var(--hair); min-width: 0; }
  .idx:last-child { border-right: 0; }
  .idx .n { color: var(--muted); font-size: 13px; }
  .idx .v { font-size: 19px; font-weight: 650; }
  .idx .p { font-size: 13px; font-weight: 600; }
  .idx .d { display: inline-block; margin-top: 2px; padding: 0 7px; border-radius: 999px; background: var(--surface); color: var(--muted); font-size: 12px; line-height: 18px; }

  /* overview */
  .ov-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 16px; }
  .ov { display: flex; flex-direction: column; gap: 12px; text-decoration: none; color: inherit; transition: transform .15s, box-shadow .15s; cursor: pointer; }
  .ov:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(31, 43, 77, .07); }
  .ov-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .ov-head h2 { margin: 0; font-size: 14px; color: var(--muted); font-weight: 550; }
  .verdict { font-size: 21px; font-weight: 650; line-height: 1.35; overflow-wrap: anywhere; }
  .verdict div + div { margin-top: 2px; }
  .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .tile { background: var(--surface); border-radius: var(--radius); padding: 10px 12px; min-width: 0; }
  .tile .l { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .tile .v { font-size: 19px; font-weight: 650; line-height: 1.3; }
  .tile .v small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .tile .d { font-size: 13px; overflow-wrap: anywhere; }
  .spark { height: 64px; }
  .ov-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; margin-top: auto; }
  .ov-foot .go { color: var(--ink); font-weight: 600; white-space: nowrap; }
  .mini-rank { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px; }
  .mini-rank h4 { margin: 0 0 2px; font-size: 13px; color: var(--muted); font-weight: 500; }
  .mini-rank .row { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; padding: 3px 0; border-bottom: 1px solid var(--hair); }
  .mini-rank .row span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-rank .row span:last-child { font-variant-numeric: tabular-nums; }

  /* detail hero */
  .hero { margin-top: 16px; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 24px; flex-wrap: wrap; }
  .hero .big { font-size: 24px; font-weight: 650; line-height: 1.35; margin-top: 6px; overflow-wrap: anywhere; }
  .hero .big div + div { margin-top: 2px; }
  .hero .sub { color: var(--muted); white-space: pre-line; margin-top: 4px; font-size: 14px; overflow-wrap: anywhere; }

  /* mini cards (liquidity) */
  .grid-mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .mini { padding: 14px 16px 10px; display: flex; flex-direction: column; min-height: 156px; }
  .mini .top { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; color: var(--muted); }
  .mini .top .d { white-space: nowrap; }
  .mini .val { margin-top: 6px; font-size: 24px; font-weight: 650; line-height: 1.2; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .mini .val .u { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .mini .chg { font-size: 13px; font-weight: 600; margin-top: 2px; }
  .mini .note { font-size: 12px; color: var(--muted); min-height: 17px; margin-top: 2px; }
  .mini .spark { height: 40px; margin-top: auto; }
  .mini.empty .val { color: var(--muted); }

  /* vote */
  .vote-head { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .vote-head b { font-size: 15px; }
  .vote-head .lab { font-weight: 650; font-size: 16px; }
  .signals { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .sig { border-top: 2px solid var(--tone, var(--muted)); background: var(--surface); border-radius: 0 0 var(--radius) var(--radius); padding: 10px 12px; min-width: 0; }
  .sig .n { color: var(--muted); font-size: 13px; }
  .sig .d { font-size: 16px; font-weight: 650; color: var(--tone, var(--muted)); }
  .sig .x { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .rate-line { margin-top: 12px; padding: 12px 16px; border: 1px solid var(--hair); border-radius: var(--radius); font-size: 14px; overflow-wrap: anywhere; }
  .rate-line b { font-weight: 650; }

  /* tables / news */
  .tbl-wrap { overflow-x: auto; }

  /* liquidity gauge */
  .gh { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 8px 32px; align-items: center; margin-top: 16px; }
  .gh h2 { margin: 0 0 2px; font-size: 22px; }
  .gh .q { color: var(--muted); margin: 0 0 6px; }
  .gauge svg { width: 100%; height: auto; display: block; }
  .gauge.mini svg { max-width: 300px; margin: 0 auto; }
  .gauge .seg-label { font-size: 13px; font-weight: 600; fill: var(--muted); letter-spacing: .5px; }
  .gauge .seg-label.on { fill: #fff; }
  .gauge .tick { font-size: 11px; fill: var(--muted); }
  .gauge .val { font-size: 46px; font-weight: 700; fill: var(--ink); }
  .gauge .vlab { font-size: 15px; font-weight: 600; }
  .gh .why { font-size: 15px; margin-top: 4px; overflow-wrap: anywhere; }
  .gh .gate { font-size: 13px; margin-top: 8px; padding: 6px 10px; border-left: 2px solid var(--warm); background: color-mix(in oklab, var(--warm) 10%, white); border-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: var(--surface); color: var(--muted); }
  .chip.on { background: color-mix(in oklab, var(--warm) 14%, white); color: var(--warm); font-weight: 600; }
  .ghist { display: flex; flex-direction: column; }
  .ghist .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--hair); }
  .ghist .row:first-child { border-top: 0; }
  .ghist .when { color: var(--muted); font-size: 14px; }
  .ghist .when b { display: block; color: var(--ink); font-size: 14px; font-weight: 600; }
  .bubble { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; border: 1px solid var(--hair); background: #fff; }
  .comp { width: 100%; border-collapse: collapse; font-size: 14px; }
  .comp th { text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 6px 8px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
  .comp td { padding: 10px 8px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
  .comp tr:last-child td { border-bottom: 0; }
  .comp .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .comp th.num { text-align: right; }
  .comp .grp td { background: var(--surface); color: var(--muted); font-size: 12.5px; padding: 4px 8px; }
  .comp .nm small { display: block; color: var(--muted); font-size: 12px; }
  .comp .u { font-size: 12px; color: var(--muted); margin-left: 3px; }
  .meter { position: relative; height: 8px; border-radius: 4px; min-width: 120px; opacity: .28;
           background: linear-gradient(90deg, var(--z0) 0 25%, var(--z1) 25% 45%, var(--z2) 45% 55%, var(--z3) 55% 75%, var(--z4) 75% 100%); }
  .meterbox { position: relative; }
  .meterbox .pin { position: absolute; top: -4px; width: 4px; height: 16px; margin-left: -2px; border-radius: 2px; background: var(--ink); }
  .zl { font-size: 12px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; color: #fff; }
  .gmini .sub { color: var(--muted); font-size: 13px; }
  .more { margin-top: 28px; border: 1px solid var(--hair); border-radius: var(--radius); padding: 10px 16px; }
  .more > summary { cursor: pointer; font-weight: 650; font-size: 16px; }
  .remind .rl { padding: 6px 0; border-top: 1px dashed var(--hair); }
  .remind .rl:first-of-type { border-top: 0; }
  .remind .rl.today { font-weight: 650; }
  .exp-note { font-size: 12px; color: var(--muted); margin-left: 8px; font-weight: 400; }
  @media (max-width: 820px) { .gh { grid-template-columns: minmax(0, 1fr); } }
  table.ops { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 520px; }
  table.ops th { text-align: left; color: var(--muted); font-weight: 500; font-size: 13px; padding: 6px 10px; border-bottom: 1px solid var(--hair); white-space: nowrap; }
  table.ops td { padding: 8px 10px; border-bottom: 1px solid var(--hair); vertical-align: top; }
  table.ops tr:last-child td { border-bottom: 0; }
  .watch-line { font-size: 13px; color: var(--ink); background: var(--surface); border-left: 2px solid var(--warm); border-radius: 4px; padding: 6px 10px; margin-top: 10px; }
  table.ops td.r, table.ops th.r { text-align: right; }
  table.ops a, ul.news a.ttl { text-decoration-color: var(--hair); text-underline-offset: 3px; }
  .news-tabs { margin-bottom: 8px; }
  ul.news { list-style: none; margin: 0; padding: 0; }
  ul.news li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 9px 2px; border-bottom: 1px solid var(--hair); }
  ul.news li:last-child { border-bottom: 0; }
  ul.news .tm, ul.news .src { color: var(--muted); font-size: 13px; white-space: nowrap; }
  ul.news .ttl { flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; color: var(--ink); }
  .tag { display: inline-block; font-size: 12px; line-height: 1.5; color: var(--warm); border: 1px solid var(--warm); border-radius: 4px; padding: 0 6px; white-space: nowrap; }

  /* charts */
  .chart-card { padding: 14px 14px 8px; }
  .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .card h3 { margin: 0 0 2px; font-size: 15px; font-weight: 650; line-height: 1.4; }
  .sub-line { margin: 0 0 10px; color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .sub-line b { font-weight: 650; }
  #sector-chart { width: 100%; }
  #etf-chart { width: 100%; height: 340px; }
  #monthly-chart { width: 100%; height: 230px; }
  #temp-chart { width: 100%; height: 320px; }
  .two-col { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 16px; align-items: start; }
  .note-foot { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .note-foot b { color: var(--ink); font-weight: 600; }
  .mini-title { font-size: 13px; color: var(--muted); margin: 14px 0 2px; }

  /* team */
  .last3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 4px; }
  .day-card { background: var(--surface); border-radius: var(--radius); padding: 10px 12px; min-width: 0; }
  .day-card .dt { font-size: 13px; color: var(--muted); }
  .day-card .dv { margin-top: 2px; font-size: 20px; font-weight: 650; line-height: 1.25; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .day-card .dv small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .day-card.pending .dv { color: var(--muted); font-size: 16px; font-weight: 500; }
  .fp-list { list-style: none; margin: 0; padding: 0; }
  .fp-list li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; padding: 9px 0; border-bottom: 1px solid var(--hair); font-size: 14px; }
  .fp-list li:last-child { border-bottom: 0; }
  .fp-list .nm small { color: var(--muted); font-size: 12px; margin-left: 6px; }
  .fp-list .vl { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
  .fp-list .vl .y { color: var(--muted); font-weight: 400; }
  .concl-box { display: flex; align-items: center; gap: 16px; border: 1px solid var(--hair); border-left: 3px solid var(--warm); border-radius: var(--radius); padding: 12px 16px; margin: 12px 0 14px; }
  .concl-box .big { flex: 0 0 auto; text-align: center; min-width: 78px; }
  .concl-box .big .n { font-size: 32px; font-weight: 650; line-height: 1.1; }
  .concl-box .big .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .concl-box .txt { font-size: 14px; line-height: 1.6; min-width: 0; overflow-wrap: anywhere; }
  .concl-box .txt b { font-weight: 650; }
  .ratio-row { display: grid; grid-template-columns: 6.6em 1fr 3.4em; align-items: center; gap: 8px; margin: 7px 0; font-size: 14px; }
  .ratio-row .rn { white-space: nowrap; }
  .ratio-row .rv { text-align: right; font-weight: 650; font-variant-numeric: tabular-nums; }
  .ratio-track { position: relative; height: 10px; background: var(--surface); border-radius: 5px; }
  .ratio-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
  .ratio-ref { position: absolute; top: -3px; bottom: -3px; border-left: 1.5px dashed var(--ink); }

  /* retail */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 16px; }
  .kpi .kl { font-size: 13px; color: var(--muted); }
  .kpi .kv { margin-top: 2px; font-size: 34px; font-weight: 650; line-height: 1.2; color: var(--tone, var(--ink)); white-space: nowrap; }
  .kpi .kv small { font-size: 14px; font-weight: 400; color: var(--muted); margin: 0 3px; }
  .kpi .ks { margin-top: 2px; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
  .band { display: flex; margin: 4px 0 8px; border-radius: 6px; overflow: hidden; font-size: 12px; }
  .band span { flex: 1 1 0; text-align: center; padding: 4px 2px; color: #fff; font-weight: 600; min-width: 0; white-space: nowrap; }
  .band span.cur { box-shadow: inset 0 0 0 2px var(--ink); }
  .dims { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 6px; }
  .dims span { background: var(--surface); border-radius: 999px; padding: 2px 11px; font-size: 13px; color: var(--muted); }
  .dims span b { color: var(--ink); margin-left: 4px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .dims-line { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .wall-intro { font-size: 13px; color: var(--muted); margin: 0 0 6px; overflow-wrap: anywhere; }
  .wall-intro b { color: var(--ink); font-weight: 650; }
  table.wall { width: 100%; border-collapse: collapse; }
  table.wall th { text-align: left; color: var(--muted); font-weight: 500; font-size: 13px; padding: 6px 8px; border-bottom: 1px solid var(--hair); }
  table.wall th.r, table.wall td.r { text-align: right; }
  table.wall td { padding: 10px 8px; border-bottom: 1px solid var(--hair); vertical-align: middle; }
  table.wall tr:last-child td { border-bottom: 0; }
  table.wall tr.first td { background: var(--surface); }
  table.wall tr.first td:first-child { border-radius: 6px 0 0 6px; }
  table.wall tr.first td:last-child { border-radius: 0 6px 6px 0; }
  table.wall .nm { font-weight: 600; }
  table.wall .nm small { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; white-space: nowrap; }
  table.wall td.bar { width: 40%; }
  .wbar { position: relative; height: 10px; background: var(--surface); border-radius: 5px; }
  .wbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }

/* ================= liquidity gauge ================= */

function gaugeOk(g) { return !!g && isNum(g.value); }
function renderGaugeHero(p) {
  var G = DATA.liquidity_index;
  var card = el("div", "card gh");

function kpiCard(label, tone, build, sub) {
  var c = el("div", "card kpi t-" + tone);
  c.appendChild(el("div", "kl", label));
  var v = el("div", "kv tnum");
  build(v);
  c.appendChild(v);
  c.appendChild(el("div", "ks", sub));
  return c;
}
function tempKpis(K, T) {
  var g = el("div", "kpi-grid"), f1 = function (v) { return isNum(v) ? fmtNum(v, 1) : DASH; };
  g.appendChild(kpiCard("今日体温", tempTone(K.today), function (v) {
    v.textContent = f1(K.today);
    if (isNum(K.today)) v.appendChild(el("small", null, "分"));
  }, "五维口径 · 六维含浓度为 " + f1(T.six_dim)));
  g.appendChild(kpiCard("昨日 → 今日", signTone(K.delta, 2), function (v) { v.textContent = isNum(K.delta) ? fmtSigned(K.delta, 1) : DASH; },
    "昨 " + f1(K.yday) + " → 今 " + f1(K.today) + " · " + (K.delta_text || DASH)));
  g.appendChild(kpiCard("30 日均值偏离", signTone(K.dev, 5), function (v) { v.textContent = isNum(K.dev) ? fmtSigned(K.dev, 1) : DASH; },
    "今日 " + f1(K.today) + " vs 均值 " + f1(K.mean) + " · " + (K.dev_text || DASH)));
  g.appendChild(kpiCard("近 " + (isNum(K.n) ? K.n : 30) + " 日排名", tempTone(K.today), function (v) {
    if (!isNum(K.rank)) { v.textContent = DASH; return; }
    v.appendChild(el("small", null, "第"));
    v.appendChild(document.createTextNode(String(K.rank)));
    v.appendChild(el("small", null, "高"));
  }, (isNum(K.n) ? K.n : DASH) + " 期中高于 " + (isNum(K.pct_above) ? fmtNum(K.pct_above, 0) : DASH) + "% 的交易日 · 最高 " + f1(K.max) + "（" + (fmtDay(K.max_date) || DASH) + "）"));
  return g;
}
var BANDS = [["过热 80+", C.up, 80], ["温暖 60–80", C.warm, 60], ["中性 40–60", "#a8923a", 40], ["偏冷 20–40", "#6f9cc4", 20], ["冰冷 <20", C.cold, -Infinity]];
function bandLegend(today) {
  var wrap = el("div", "band"), hit = false;
  BANDS.forEach(function (b) {
    var s = el("span", null, b[0]);
    s.style.background = b[1];
    if (!hit && isNum(today) && today >= b[2]) { s.className = "cur"; hit = true; }
    wrap.appendChild(s);
  });
  return wrap;
}
function tempOption(T, narrow) {
  var ser = (T.series || []).filter(function (r) { return r && isNum(r.score); }), K = T.kpis || {};
  var n = ser.length, last = n - 1;
  var vals = ser.map(function (r) { return r.score; }), dates = ser.map(function (r) { return r.date; });
  var mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals), maxI = vals.indexOf(mx), minI = vals.indexOf(mn);
  var mean = isNum(K.mean) ? K.mean : vals.reduce(function (a, b) { return a + b; }, 0) / n;
  var data = vals.map(function (v, i) {
    var it = { value: v };
    if (i === maxI) {
      it.symbol = "circle"; it.symbolSize = 9; it.itemStyle = { color: C.up, borderColor: "#fff", borderWidth: 2 };
      it.label = { show: true, position: "top", distance: 8, color: C.up, fontSize: 12, fontWeight: 600, align: i >= n - 3 ? "right" : i <= 1 ? "left" : "center", formatter: fmtNum(v, 1) + " · 区间最高" };
    }
    if (i === minI) {
      it.symbol = "circle"; it.symbolSize = 9; it.itemStyle = { color: C.down, borderColor: "#fff", borderWidth: 2 };
      it.label = { show: true, position: "bottom", distance: 8, color: C.down, fontSize: 12, fontWeight: 600, align: i >= n - 3 ? "right" : i <= 1 ? "left" : "center", formatter: fmtDay(dates[i]) + " · " + fmtNum(v, 1) };
    }
    if (i === last) {
      it.symbol = "circle"; it.symbolSize = 11;
      it.itemStyle = { color: i === minI ? C.down : C.up, borderColor: "#fff", borderWidth: 2 };
      if (i !== minI) {
        it.label = { show: true, position: "top", distance: 12, align: "right", offset: [12, 0], backgroundColor: "rgba(255,255,255,0.85)", padding: [0, 4], borderRadius: 4,
          formatter: "{b|今日 " + fmtNum(v, 1) + "}" + (i === maxI ? "\n{s|区间最高}" : ""),
          rich: { b: { fontSize: narrow ? 17 : 22, fontWeight: 650, color: C.up, lineHeight: narrow ? 22 : 28 }, s: { fontSize: 12, fontWeight: 600, color: C.up, align: "right" } } };
      }
    }
    return it;
  });
  return baseOpt({
    grid: { left: 36, right: narrow ? 22 : 30, top: 56, bottom: 28 },
    tooltip: tip({ trigger: "axis", formatter: function (ps) {
      var q = ps.filter(function (x) { return x.seriesType === "line"; })[0] || ps[0];
      return esc(fmtDateLong(dates[q.dataIndex])) + "<br>体温 " + esc(fmtNum(vals[q.dataIndex], 1));
    } }),
    xAxis: axisCat(dates, { axisLabel: { color: C.muted, fontSize: 12, formatter: function (v) { return fmtDay(v); }, hideOverlap: true } }),
    yAxis: [
      axisVal({ min: Math.max(0, Math.floor((mn - 6) / 10) * 10), max: Math.min(100, Math.ceil((mx + 12) / 10) * 10) }),
      { type: "value", show: false, min: 0, max: 1 }
    ],
    series: [
      { type: "bar", yAxisIndex: 1, barWidth: "100%", barCategoryGap: "0%", silent: true, z: 0, tooltip: { show: false },
        data: vals.map(function (_, i) { return i === last ? { value: 1, itemStyle: { color: "rgba(184,101,26,0.10)" } } : null; }) },
      { type: "line", z: 3, data: data, symbol: "circle", symbolSize: 4, smooth: false, lineStyle: { width: 1.8, color: C.warm }, itemStyle: { color: C.warm },
        areaStyle: areaGrad(C.warm, "22"),
        markLine: { silent: true, symbol: "none", lineStyle: { type: "dashed", color: C.muted, width: 1 },
          label: { position: "insideStartTop", color: C.muted, fontSize: 12, backgroundColor: "rgba(255,255,255,0.85)", padding: [1, 4], borderRadius: 3, formatter: "30 日均值 " + fmtNum(mean, 1) },
          data: [{ yAxis: mean }] } }
    ]
  });
}
function renderTemperature(body) {
  var T = DATA.temperature || {}, K = T.kpis || {};
  var ser = (T.series || []).filter(function (r) { return r && isNum(r.score); });
  if (!ser.length && !isNum(K.today)) { body.appendChild(el("div", "card empty-note", "体温暂无数据")); return; }
  body.appendChild(tempKpis(K, T));
  secTitle(body, "散户体温", "五维合成：上涨占比、涨幅中位数、涨停、量能、赚钱效应");
  var card = el("div", "card chart-card");
  card.appendChild(bandLegend(K.today));
  var box = el("div");
  box.id = "temp-chart";
  card.appendChild(box);
  var dims = el("div", "dims");
  [["up_ratio", "上涨家数占比"], ["median", "涨跌幅中位数"], ["limit", "涨停情绪"], ["volume", "量能"], ["profit", "赚钱效应"]].forEach(function (d) {
    var s = el("span", null, d[1]);
    s.appendChild(el("b", null, isNum((T.dims || {})[d[0]]) ? fmtNum(T.dims[d[0]], 1) : DASH));
    dims.appendChild(s);
  });
  var line = el("div", "dims-line"), R = T.range || {};
  add(line,
    el("span", "up", "涨停 " + (isNum(T.limit_up) ? T.limit_up : DASH) + " 家"), document.createTextNode(" / "),
    el("span", "down", "跌停 " + (isNum(T.limit_down) ? T.limit_down : DASH) + " 家"),
    document.createTextNode(" · 样本区间 " + (R.start ? fmtDateLong(R.start) : DASH) + " — " + (R.end ? fmtDateLong(R.end) : DASH) + " · 共 " + (isNum(R.n) ? R.n : DASH) + " 期"));
  add(card, el("div", "dims-line", "今日五个维度分项（各 0–100，等权平均）"), dims, line);
  body.appendChild(card);

  var chart = null;
  function draw() {
    if (!ser.length || typeof echarts === "undefined") {
      chart = dropChart(chart);
      chartMsg(box, ser.length ? "图表库未加载（需联网访问 cdnjs）" : "无数据");
      return;
    }
    if (!chart) { box.textContent = ""; chart = makeChart(box); }
    if (!chart) return;
    chart.setOption(tempOption(T, isNarrow()), true);
    chart.resize();
  }
  draw();
  onBreakpoint(draw);
}
function renderWall(body) {
  var Cn = DATA.concentration || {};
  var rows = (Array.isArray(Cn.rows) ? Cn.rows : []).filter(Boolean).slice().sort(function (a, b) {
    return (isNum(b.today) ? b.today : -1) - (isNum(a.today) ? a.today : -1);
  });
  secTitle(body, "板块韭菜浓度热力墙", (Cn.mode || "") + (Cn.date ? " · " + fmtDay(Cn.date) : ""));
  var card = el("div", "card");
  card.appendChild(el("p", "wall-intro", "黑色竖刻度 = 昨日值"));
  var mk = el("p", "wall-intro");
  add(mk, document.createTextNode("全市场韭菜浓度 "), el("b", null, isNum(Cn.market) ? fmtNum(Cn.market, 2) + "%" : DASH),
    document.createTextNode("（昨 " + (isNum(Cn.market_yday) ? fmtNum(Cn.market_yday, 2) + "%" : DASH) + "）"));
  card.appendChild(mk);
  if (!rows.length) { card.appendChild(el("div", "empty-note", "无数据")); body.appendChild(card); return; }
  var t = el("table", "wall"), thead = el("thead"), hr = el("tr");
  [["板块", ""], ["浓度（黑刻度 = 昨日）", "bar"], ["今日", "r"], ["环比（pp）", "r"]].forEach(function (c) { hr.appendChild(el("th", c[1], c[0])); });
  thead.appendChild(hr); t.appendChild(thead);
  var tb = el("tbody");
  rows.forEach(function (r, i) {
    var col = TONE_COLOR[r.color] || C.muted;
    var tr = el("tr", i === 0 ? "first" : "");
    var nm = el("td", "nm", (r.icon ? r.icon + " " : "") + (r.name || DASH));
    nm.appendChild(el("small", null, "n=" + (isNum(r.n) ? r.n : DASH)));
    var bar = el("td", "bar"), wb = el("div", "wbar");
    if (isNum(r.today)) { var fill = el("i"); fill.style.width = Math.max(0, Math.min(100, r.today)) + "%"; fill.style.background = col; wb.appendChild(fill); }
    if (isNum(r.yday)) {
      var tick = el("u");
      tick.style.left = "calc(" + Math.max(0, Math.min(100, r.yday)) + "% - 1px)";
      tick.title = "昨日 " + fmtNum(r.yday, 2) + "%";
      wb.appendChild(tick);
    }
    bar.appendChild(wb);
    var pv = el("td", "r pv", isNum(r.today) ? fmtNum(r.today, 2) + "%" : DASH);
    pv.style.color = col;
    var cv = el("td", "r cv " + (isNum(r.chg) ? dirClass(r.chg) : "flat"), isNum(r.chg) ? fmtSigned(r.chg, 2) : "新增");
    add(tr, nm, bar, pv, cv); tb.appendChild(tr);
  });
  t.appendChild(tb); card.appendChild(t); body.appendChild(card);
}
function renderRetail(p) {
  guard(p, function () { heroBand(p, "retail"); });
  guard(p, renderTemperature);
  guard(p, renderWall);
}

/* ================= footer (facts, warnings) ================= */
function renderFooter(root) {
  var m = DATA.meta || {};
  var w = Array.isArray(m.warnings) ? m.warnings : [];
  if (w.length) {
    var d = el("details");
    d.appendChild(el("summary", null, "数据告警（" + w.length + " 条）"));
    var ul = el("ul");
    w.forEach(function (t) { ul.appendChild(el("li", null, String(t))); });
    d.appendChild(ul);
    root.appendChild(d);
  }
  root.appendChild(el("p", null, "交易日 " + fmtDateLong(m.trade_date) + " · 生成 " + (m.generated_at || DASH) + "（北京时间） · 浓度墙板块口径 " + (m.sector_mode || DASH) +
    " · 尾盘来源 " + (m.tail_source || DASH) + " · 各面板数据日期见卡片角标"));
  root.appendChild(el("p", null, "数据来源：tushare、FRED 公开数据；仅供复盘参考，不构成投资建议。"));
}

/* ================= routing ================= */
var PAGES = [
  { key: "home", name: "总览", render: renderHome },
  { key: "liquidity", name: "流动性", render: renderLiquidity },
  { key: "sector", name: "板块流向", render: renderSector },
  { key: "team", name: "国家队", render: renderTeam },
  { key: "retail", name: "散户情绪", render: renderRetail }
];
var rendered = {};
function route() {
  var key = (location.hash || "#home").slice(1);
  var page = PAGES.filter(function (x) { return x.key === key; })[0] || PAGES[0];
  key = page.key;
  PAGES.forEach(function (x) { document.getElementById("p-" + x.key).classList.toggle("on", x.key === key); });
  Array.prototype.forEach.call(document.querySelectorAll("#nav a"), function (a) {
    var on = a.dataset.key === key;
    a.classList.toggle("on", on);
    if (on) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
  });
  var node = document.getElementById("p-" + key);
  if (!rendered[key]) {                         /* draw on first open: ECharts cannot measure a hidden node */
    rendered[key] = true;
    guard(node, page.render);
    flushCharts();
    if (key !== "home") { var b = el("a", "back", "← 返回总览"); b.href = "#home"; node.appendChild(b); }
  }
  resizeVisible();
  window.scrollTo(0, 0);
}

(function () {
  var app = document.querySelector(".wrap");
  if (!DATA) { app.appendChild(el("p", "empty-note", "未注入数据（请通过 build.py 生成页面）")); return; }
  var m = DATA.meta || {};
  if (m.demo) document.getElementById("demo-banner").style.display = "block";
  document.getElementById("meta").textContent = "交易日 " + (fmtDay(m.trade_date) || DASH) + " · " + (m.generated_at || DASH) + " 更新";
  var nav = document.getElementById("nav");
  PAGES.forEach(function (x) {
    var a = el("a", null, x.name);
    a.href = "#" + x.key; a.dataset.key = x.key;
    if (concl[x.key]) { var d = el("span", "dot"); d.style.setProperty("--tone", TONE_COLOR[concl[x.key].tone] || C.muted); a.appendChild(d); }
    nav.appendChild(a);
  });
  guard(document.getElementById("foot"), renderFooter);
  window.addEventListener("hashchange", route);
  route();
})();
</script>
