<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A 股盘后看板</title>
<style>
  :root {
    --bg: #f6f1ea; --card: #fffdf9; --border: #ece3d6; --track: #f1ebe2;
    --red: #c8402f; --green: #2a9d75; --orange: #e08a2a; --blue: #2f5d8a; --grey: #8a8178;
    --ink: #2b2723; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.5; font-variant-numeric: tabular-nums;
  }
  #demo-banner { display: none; background: var(--red); color: #fff; text-align: center; padding: 8px 12px; font-weight: 600; }
  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 40px; }
  .num, .tnum { font-variant-numeric: tabular-nums; }
  .up { color: var(--red); } .down { color: var(--green); } .flat, .muted { color: var(--grey); }
  .t-red { --tone: var(--red); } .t-orange { --tone: var(--orange); } .t-blue { --tone: var(--blue); }
  .t-green { --tone: var(--green); } .t-gray { --tone: var(--grey); }

  /* header */
  .page-head h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: .5px; }
  .meta-line { display: flex; flex-wrap: wrap; gap: 6px 8px; color: var(--grey); font-size: 12.5px; }
  .meta-line span { background: var(--card); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }

  /* conclusion strip */
  .conclusions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 18px 0 8px; }
  .concl {
    background: var(--card); border: 1px solid var(--border); border-left: 5px solid var(--tone, var(--grey));
    border-radius: var(--radius); padding: 16px 18px; min-width: 0;
  }
  .concl .c-title { font-size: 12.5px; color: var(--grey); margin-bottom: 6px; letter-spacing: 1px; }
  .concl .c-text { font-size: 17px; font-weight: 700; line-height: 1.4; color: var(--ink); overflow-wrap: anywhere; }
  .concl .c-text div + div { margin-top: 2px; }
  .concl .c-sub { margin-top: 8px; font-size: 12.5px; color: var(--grey); white-space: pre-line; overflow-wrap: anywhere; }

  /* section */
  section.block { margin-top: 32px; }
  .sec-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .sec-head h2 { margin: 0; font-size: 20px; padding-left: 12px; border-left: 4px solid var(--red); line-height: 1.25; }
  .sec-head .sub { margin: 4px 0 0 16px; color: var(--grey); font-size: 12.5px; }
  .sub-head { margin: 22px 0 10px; font-size: 14.5px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .sub-head small { font-weight: 400; color: var(--grey); font-size: 12px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }

  /* segmented toggle */
  .seg { display: inline-flex; background: #ece7df; border-radius: 999px; padding: 3px; gap: 2px; }
  .seg button {
    font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--grey);
    padding: 4px 14px; border-radius: 999px; cursor: pointer;
  }
  .seg button[aria-selected="true"], .seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(60, 40, 20, .15); }

  /* index strip */
  .idx-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; padding: 6px 4px; }
  .idx { padding: 8px 14px; border-right: 1px dashed var(--border); min-width: 0; }
  .idx:last-child { border-right: 0; }
  .idx .n { color: var(--grey); font-size: 12.5px; }
  .idx .v { font-size: 20px; font-weight: 700; }
  .idx .p { font-size: 13px; font-weight: 600; }
  .idx .d { display: inline-block; margin-top: 2px; padding: 0 6px; border-radius: 8px; background: var(--border); color: var(--grey); font-size: 11px; line-height: 17px; }

  /* mini cards */
  .grid-mini { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .mini { padding: 14px 16px 10px; display: flex; flex-direction: column; min-height: 150px; }
  .mini .top { display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; color: var(--grey); }
  .mini .top .d { white-space: nowrap; font-size: 11.5px; }
  .mini .val { margin-top: 6px; font-size: 26px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
  .mini .val .u { font-size: 12px; font-weight: 400; color: var(--grey); margin-left: 3px; }
  .mini .chg { font-size: 12.5px; font-weight: 600; margin-top: 2px; }
  .mini .note { font-size: 11.5px; color: var(--grey); min-height: 17px; margin-top: 2px; }
  .mini .spark { height: 40px; margin-top: auto; }
  .mini.empty .val { color: #b9b1a7; }

  /* vote */
  .vote-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .vote-head b { font-size: 15px; }
  .vote-head .lab { font-weight: 700; font-size: 16px; }
  .signals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .sig { border-top: 3px solid var(--tone, var(--grey)); background: #faf6ef; border-radius: 8px; padding: 10px 12px; min-width: 0; }
  .sig .n { color: var(--grey); font-size: 12.5px; }
  .sig .d { font-size: 16px; font-weight: 700; color: var(--tone, var(--grey)); }
  .sig .x { font-size: 12px; color: var(--grey); overflow-wrap: anywhere; }
  .rate-line { margin-top: 12px; padding: 12px 16px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); font-size: 13.5px; overflow-wrap: anywhere; }
  .rate-line b { font-weight: 700; }

  /* tables / news */
  .tbl-wrap { overflow-x: auto; }
  table.ops { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 520px; }
  table.ops th { text-align: left; color: var(--grey); font-weight: 500; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.ops td { padding: 8px 10px; border-bottom: 1px dashed var(--border); vertical-align: top; }
  table.ops td.r, table.ops th.r { text-align: right; }
  .empty-note { color: var(--grey); padding: 14px 4px; text-align: center; }
  .news-tabs { margin-bottom: 8px; }
  ul.news { list-style: none; margin: 0; padding: 0; }
  ul.news li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 9px 2px; border-bottom: 1px dashed var(--border); }
  ul.news li:last-child { border-bottom: 0; }
  ul.news .tm { color: var(--grey); font-size: 12px; white-space: nowrap; }
  ul.news .src { color: var(--blue); font-size: 12px; white-space: nowrap; }
  ul.news .ttl { flex: 1 1 260px; min-width: 0; overflow-wrap: anywhere; color: var(--ink); text-decoration: none; }
  ul.news a.ttl:hover { text-decoration: underline; color: var(--blue); }
  .tag { display: inline-block; font-size: 11.5px; line-height: 1.4; color: var(--orange); border: 1px solid var(--orange); border-radius: 4px; padding: 0 6px; white-space: nowrap; }

  /* sector chart */
  #sector-chart { width: 100%; }
  .chart-msg { color: var(--grey); text-align: center; padding: 40px 0; }

  /* footer */
  footer.foot { margin-top: 36px; color: var(--grey); font-size: 12.5px; }
  footer.foot details { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 16px; }
  footer.foot summary { cursor: pointer; color: var(--orange); font-weight: 600; }
  footer.foot ul { margin: 8px 0 0; padding-left: 18px; }
  footer.foot li { overflow-wrap: anywhere; }
  footer.foot p { margin: 12px 0 0; }

  /* team (国家队) */
  .chart-card { padding: 14px 14px 8px; }
  #etf-chart { width: 100%; height: 340px; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px; align-items: start; }
  .card h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.35; }
  .card .sub-line { margin: 0 0 12px; color: var(--grey); font-size: 12.5px; overflow-wrap: anywhere; }
  .card .sub-line b { font-weight: 700; }
  .last3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .day-card { background: #faf6ef; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .day-card .dt { font-size: 12px; color: var(--grey); }
  .day-card .dv { margin-top: 2px; font-size: 22px; font-weight: 700; line-height: 1.25; white-space: nowrap; }
  .day-card .dv small { font-size: 11.5px; font-weight: 400; color: var(--grey); margin-left: 2px; }
  .day-card.pending .dv { color: #b0a79b; font-size: 17px; font-weight: 600; }
  .mini-title { font-size: 12.5px; color: var(--grey); margin: 4px 0 2px; }
  #monthly-chart { width: 100%; height: 230px; }
  .note-foot { margin: 8px 0 0; font-size: 12px; color: var(--grey); }
  .note-foot b { color: var(--ink); }

  .fp-list { list-style: none; margin: 0; padding: 0; }
  .fp-list li { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; padding: 9px 0; border-bottom: 1px dashed var(--border); font-size: 14px; }
  .fp-list li:last-child { border-bottom: 0; }
  .fp-list .nm { color: var(--ink); }
  .fp-list .nm small { color: var(--grey); font-size: 12px; margin-left: 6px; }
  .fp-list .vl { font-weight: 600; text-align: right; }
  .fp-list .vl .y { color: var(--grey); font-weight: 400; }
  .concl-box { display: flex; align-items: center; gap: 16px; border: 1.5px solid var(--orange); border-radius: 12px; padding: 12px 16px; margin: 12px 0 14px; background: #fff9f1; }
  .concl-box .big { flex: 0 0 auto; text-align: center; min-width: 78px; }
  .concl-box .big .n { font-size: 36px; font-weight: 800; line-height: 1.1; }
  .concl-box .big .s { font-size: 11.5px; color: var(--grey); margin-top: 2px; }
  .concl-box .txt { font-size: 13.5px; line-height: 1.6; min-width: 0; overflow-wrap: anywhere; }
  .concl-box .txt b { color: var(--orange); }
  .ratio-row { display: grid; grid-template-columns: 6.6em 1fr 3.4em; align-items: center; gap: 8px; margin: 7px 0; font-size: 13px; }
  .ratio-row .rn { color: var(--ink); white-space: nowrap; }
  .ratio-row .rv { text-align: right; font-weight: 700; }
  .ratio-track { position: relative; height: 12px; background: var(--track); border-radius: 6px; }
  .ratio-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
  .ratio-ref { position: absolute; top: -3px; bottom: -3px; border-left: 2px dashed #5a5249; }

  /* retail (散户情绪) */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .kpi { padding: 16px 18px; }
  .kpi .kl { font-size: 12.5px; color: var(--grey); }
  .kpi .kv { margin-top: 4px; font-size: 40px; font-weight: 800; line-height: 1.15; color: var(--tone, var(--ink)); white-space: nowrap; }
  .kpi .kv small { font-size: 14px; font-weight: 500; color: var(--grey); margin: 0 3px; }
  .kpi .ks { margin-top: 4px; font-size: 12.5px; color: var(--grey); overflow-wrap: anywhere; }
  .band { display: flex; gap: 0; margin: 14px 0 8px; border-radius: 8px; overflow: hidden; font-size: 12px; }
  .band span { flex: 1 1 0; text-align: center; padding: 5px 2px; color: #fff; font-weight: 600; min-width: 0; white-space: nowrap; }
  .band span.cur { box-shadow: inset 0 0 0 2px #2b2723; }
  #temp-chart { width: 100%; height: 320px; }
  .dims { display: flex; flex-wrap: wrap; gap: 6px 8px; margin-top: 8px; }
  .dims span { background: #faf6ef; border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; color: var(--grey); }
  .dims span b { color: var(--ink); margin-left: 2px; }
  .dims-line { margin-top: 8px; font-size: 12.5px; color: var(--grey); }
  .wall-intro { font-size: 12.5px; color: var(--grey); margin: 0 0 6px; overflow-wrap: anywhere; }
  .wall-intro b { color: var(--ink); }
  table.wall { width: 100%; border-collapse: collapse; }
  table.wall th { text-align: left; color: var(--grey); font-weight: 500; font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--border); }
  table.wall th.r, table.wall td.r { text-align: right; }
  table.wall td { padding: 11px 8px; border-bottom: 1px dashed var(--border); vertical-align: middle; }
  table.wall tr:last-child td { border-bottom: 0; }
  table.wall tr.first td { background: #fbeeea; }
  table.wall tr.first td:first-child { border-radius: 10px 0 0 10px; }
  table.wall tr.first td:last-child { border-radius: 0 10px 10px 0; }
  table.wall .nm { font-weight: 600; }
  table.wall .nm small { color: var(--grey); font-weight: 400; font-size: 12px; margin-left: 6px; white-space: nowrap; }
  table.wall td.bar { width: 42%; }
  .wbar { position: relative; height: 12px; background: var(--track); border-radius: 6px; }
  .wbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
  .wbar u { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #1c1917; text-decoration: none; }
  table.wall td.pv { font-size: 20px; font-weight: 800; white-space: nowrap; }
  table.wall td.cv { font-weight: 700; white-space: nowrap; }

  @media (max-width: 900px) {
    .conclusions { grid-template-columns: repeat(2, 1fr); }
    .signals { grid-template-columns: repeat(2, 1fr); }
    .idx-strip { grid-template-columns: repeat(3, 1fr); row-gap: 6px; }
    .idx:nth-child(3) { border-right: 0; }
    .two-col { grid-template-columns: 1fr; }
    .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 560px) {
    main { padding: 14px 16px 32px; }
    .page-head h1 { font-size: 22px; }
    .conclusions { grid-template-columns: 1fr; gap: 10px; }
    .signals { grid-template-columns: 1fr; }
    .idx-strip { grid-template-columns: repeat(2, 1fr); }
    .idx:nth-child(3) { border-right: 1px dashed var(--border); }
    .idx:nth-child(even) { border-right: 0; }
    .grid-mini { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .mini { padding: 12px 12px 8px; }
    .mini .val { font-size: 22px; }
    .card { padding: 14px; }
    .kpi-grid { gap: 10px; }
    .kpi { padding: 12px 14px; }
    .kpi .kv { font-size: 32px; }
    #etf-chart { height: 300px; }
    #temp-chart { height: 290px; }
    .last3 { gap: 8px; }
    .day-card { padding: 8px 8px; }
    .day-card .dv { font-size: 18px; }
    .concl-box { flex-direction: column; align-items: flex-start; gap: 6px; }
    .concl-box .big { text-align: left; }
    .ratio-row { grid-template-columns: 6.6em 1fr 3.2em; gap: 6px; }
    table.wall th.bar, table.wall td.bar { display: none; }
    table.wall td { padding: 10px 6px; }
    table.wall td.pv { font-size: 18px; }
    .band span { font-size: 10.5px; }
  }
</style>
</head>
<body>
<div id="demo-banner">当前为随机模拟数据</div>
<main id="app"></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>
const DATA = /*__DATA__*/null;

/* ================= shared helpers ================= */
const COLORS = { red: "#c8402f", green: "#2a9d75", orange: "#e08a2a", blue: "#2f5d8a", grey: "#8a8178", gray: "#8a8178" };
const DASH = "—";

function $(sel, root) { return (root || document).querySelector(sel); }
/* el(tag, className, text): all external text goes through textContent */
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function add(parent) {
  for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
  return parent;
}
function isNum(v) { return typeof v === "number" && isFinite(v); }
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtNum(v, d) {
  if (!isNum(v)) return DASH;
  return v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d }).replace("-", "−");
}
function fmtSigned(v, d) {
  if (!isNum(v)) return DASH;
  var s = fmtNum(Math.abs(v), d);
  return (v > 0 ? "+" : v < 0 ? "−" : "") + s;
}
function autoDec(v) {
  var a = Math.abs(v);
  return a >= 1000 ? 0 : a >= 100 ? 1 : 2;
}
var UNIT_DEC = { "%": 2, "元": 3, "家": 0, "点": 2, "十亿美元": 1, "美元/桶": 2 };
function decFor(unit, v) { return UNIT_DEC.hasOwnProperty(unit) ? UNIT_DEC[unit] : autoDec(v); }
function dirClass(v) { return !isNum(v) || v === 0 ? "flat" : v > 0 ? "up" : "down"; }
function arrow(v) { return !isNum(v) || v === 0 ? "" : v > 0 ? "▲ " : "▼ "; }
function fmtDay(s) {            /* 20261106 -> 11/6 ; 202611 -> 2026年11月 */
  if (typeof s !== "string") return "";
  if (/^\d{8}$/.test(s)) return (+s.slice(4, 6)) + "/" + (+s.slice(6, 8));
  if (/^\d{6}$/.test(s)) return s.slice(0, 4) + "年" + (+s.slice(4, 6)) + "月";
  return s;
}
function fmtDateLong(s) {
  return typeof s === "string" && /^\d{8}$/.test(s) ? s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8) : (s || DASH);
}

/* charts registry: every chart is created via makeChart so window resize reaches it.
   RULE: ECharts reads the container size at init, so never init on a detached node (it would be 0x0).
   makeChart(dom, setup): if dom is already attached it inits now; otherwise it queues and the bootstrap
   calls flushCharts() once the renderer has attached its section. setup(chart) runs after init, then resize().
   Returns the chart when created synchronously, else null. */
var CHARTS = [], PENDING = [];
function makeChart(dom, setup) {
  if (typeof echarts === "undefined") return null;
  if (!dom.isConnected) { PENDING.push({ dom: dom, setup: setup }); return null; }
  var c = echarts.init(dom, null, { renderer: "canvas" });
  CHARTS.push(c);
  if (setup) setup(c);
  c.resize();
  return c;
}
function flushCharts() {
  var q = PENDING;
  PENDING = [];
  q.forEach(function (p) { if (p.dom.isConnected) makeChart(p.dom, p.setup); });
}
/* layout that depends on the 560px breakpoint: fn(narrow) re-runs when a resize crosses it */
var NARROW = 560;
function isNarrow() { return window.innerWidth <= NARROW; }
var BREAKPOINTS = [];
function onBreakpoint(fn) { BREAKPOINTS.push({ fn: fn, last: isNarrow() }); }
var _rt = null;
window.addEventListener("resize", function () {
  clearTimeout(_rt);
  _rt = setTimeout(function () {
    CHARTS.forEach(function (c) { c.resize(); });
    var n = isNarrow();                 /* evaluated after the debounce, when the final width is settled */
    BREAKPOINTS.forEach(function (b) { if (b.last !== n) { b.last = n; b.fn(n); } });
  }, 80);
});
window.addEventListener("load", function () { flushCharts(); CHARTS.forEach(function (c) { c.resize(); }); });

/* section skeleton: returns {root, body}; optional right-hand control */
function makeSection(title, subtitle, control) {
  var root = el("section", "block");
  var head = el("div", "sec-head");
  var left = el("div");
  add(left, el("h2", null, title));
  if (subtitle) left.appendChild(el("p", "sub", subtitle));
  add(head, left, control);
  var body = el("div");
  add(root, head, body);
  return { root: root, body: body };
}
/* segmented toggle: options [{key,label}], onChange(key) */
function makeSegmented(options, initial, onChange) {
  var seg = el("div", "seg");
  seg.setAttribute("role", "tablist");
  var btns = options.map(function (o) {
    var b = el("button", null, o.label);
    b.type = "button";
    b.setAttribute("role", "tab");
    b.addEventListener("click", function () { select(o.key, true); });
    seg.appendChild(b);
    return b;
  });
  function select(key, fire) {
    options.forEach(function (o, i) { btns[i].setAttribute("aria-selected", o.key === key ? "true" : "false"); });
    if (fire) onChange(key);
  }
  select(initial, false);
  return seg;
}
function safeUrl(u) { return typeof u === "string" && /^https?:\/\//i.test(u) ? u : null; }

/* ================= page header ================= */
function renderHeader(root) {
  var m = DATA.meta || {};
  var head = el("header", "page-head");
  head.appendChild(el("h1", null, "A 股盘后看板"));
  var line = el("div", "meta-line");
  [
    "交易日 " + fmtDateLong(m.trade_date),
    "各面板数据日期见卡片角标",
    "生成 " + (m.generated_at || DASH) + "（北京时间）",
    "板块口径 " + (m.sector_mode || DASH),
    "尾盘来源 " + (m.tail_source || DASH)
  ].forEach(function (t) { line.appendChild(el("span", null, t)); });
  head.appendChild(line);
  root.appendChild(head);
}

/* ================= four conclusions ================= */
function renderConclusions(root) {
  var wrap = el("div", "conclusions");
  (DATA.conclusions || []).forEach(function (c) {
    var tone = ["red", "orange", "blue", "green", "gray"].indexOf(c.tone) >= 0 ? c.tone : "gray";
    var card = el("div", "concl t-" + tone);
    card.appendChild(el("div", "c-title", c.title || DASH));

function renderSector(root) {
  var S = DATA.sector_flow || {};

  var sec = makeSection("板块资金流向",
    "同花顺行业口径 · 净额 = 主动买入 − 主动卖出，单位亿元" + (S.date ? " · 截至 " + fmtDay(S.date) : ""), seg);
  var card = el("div", "card");
  var box = el("div");
  box.id = "sector-chart";
  card.appendChild(box);
  sec.body.appendChild(card);
  root.appendChild(sec.root);

  var chart = null;
  function rowsFor(k) {
    var g = (S[k] || {});
    var seen = {};   /* inflow/outflow lists can overlap when fewer than 20 industries exist */
    return (g.inflow || []).concat(g.outflow || []).filter(function (r) {
      if (!r || !isNum(r.net) || seen[r.name]) return false;
      seen[r.name] = true;
      return true;
    }).sort(function (a, b) { return b.net - a.net; });
  }
  function draw() {
    var rows = rowsFor(mode);
    if (!rows.length || typeof echarts === "undefined") {
      if (chart) { chart.dispose(); CHARTS.splice(CHARTS.indexOf(chart), 1); chart = null; }
      box.style.height = "auto";
      box.textContent = "";
      box.appendChild(el("div", "chart-msg", rows.length ? "图表库未加载（需联网访问 cdnjs）" : "无数据"));
      return;
    }
    if (!chart) { box.textContent = ""; }
    var narrow = isNarrow();
    var rowH = narrow ? 34 : 30;
    box.style.height = (rows.length * rowH + 30) + "px";
    if (!chart) chart = makeChart(box);
    if (!chart) return;
    var maxAbs = Math.max.apply(null, rows.map(function (r) { return Math.abs(r.net); })) || 1;
    var lim = maxAbs * 1.28;
    chart.setOption({
      animation: true,
      grid: { left: narrow ? 78 : 112, right: 10, top: 6, bottom: 22 },
      tooltip: {
        trigger: "axis", axisPointer: { type: "shadow" },
        formatter: function (ps) {
          var r = rows[ps[0].dataIndex];
          return esc(r.name) + "<br>净额 " + esc(fmtSigned(r.net, 2)) + " 亿" +
            (isNum(r.pct) ? "<br>涨跌幅 " + esc(fmtSigned(r.pct, 2)) + "%" : "");
        }
      },
      xAxis: { type: "value", min: -lim, max: lim, splitNumber: 4,
        axisLabel: { color: "#8a8178", fontSize: 11, hideOverlap: true, showMinLabel: false, showMaxLabel: false,
          formatter: function (v) { return v === 0 ? "0" : fmtNum(v, 0); } },
        splitLine: { lineStyle: { color: "#f1ebe2" } }, axisLine: { show: false } },
      yAxis: { type: "category", inverse: true, data: rows.map(function (r) { return r.name; }),
        axisLine: { onZero: false, show: false }, axisTick: { show: false },
        axisLabel: {
          interval: 0, margin: 8, color: "#2b2723", fontSize: 12, lineHeight: 15,
          formatter: function (v, i) {
            var r = rows[i], p = r && isNum(r.pct) ? fmtSigned(r.pct, 2) + "%" : DASH;
            var pc = !isNum(r && r.pct) || r.pct === 0 ? "g" : r.pct > 0 ? "u" : "d";
            return "{n|" + v + "}\n{" + pc + "|" + p + "}";
          },
          rich: {
            n: { fontSize: 12, color: "#2b2723", align: "right" },
            u: { fontSize: 11, color: COLORS.red, align: "right" },
            d: { fontSize: 11, color: COLORS.green, align: "right" },
            g: { fontSize: 11, color: COLORS.grey, align: "right" }
          }
        } },
      series: [{
        type: "bar", barWidth: narrow ? 14 : 16,
        data: rows.map(function (r) {
          return { value: r.net, itemStyle: { color: r.net >= 0 ? COLORS.red : COLORS.green, borderRadius: r.net >= 0 ? [0, 4, 4, 0] : [4, 0, 0, 4] },
            label: { position: r.net >= 0 ? "right" : "left" } };
        }),
        label: { show: true, color: "#2b2723", fontSize: 11.5, formatter: function (p) { return fmtSigned(p.value, 1); } }
      }]
    }, true);
    chart.resize();
  }
  draw();
  onBreakpoint(function () { draw(); });
}

/* highlight signed percents and a few key phrases in the auto conclusion; everything via textContent */
var KEY_PHRASES = "托底的钱在收手|进攻的钱在换标的|成交降温 ≠ 净赎回|资金向宽基集中|整体活跃度上升|ETF 通道整体降温";
function fillHighlighted(parent, text) {
  var re = new RegExp("([+\\-−]\\d+(?:\\.\\d+)?%|" + KEY_PHRASES + ")", "g");
  String(text == null ? "" : text).split(re).forEach(function (piece, i) {
    if (!piece) return;
    if (i % 2 === 0) { parent.appendChild(document.createTextNode(piece)); return; }
    if (/^[+\-−]/.test(piece)) parent.appendChild(el("span", piece.charAt(0) === "+" ? "up" : "down", piece));
    else parent.appendChild(el("b", null, piece));

var BANDS = [["过热 80+", "#c8402f", 80], ["温暖 60–80", "#e08a2a", 60], ["中性 40–60", "#d6b34a", 40], ["偏冷 20–40", "#6f9cc4", 20], ["冰冷 <20", "#2f5d8a", -Infinity]];

function tempOption(T, narrow) {
  var ser = (T.series || []).filter(function (r) { return r && isNum(r.score); });
  var K = T.kpis || {};
  var n = ser.length, last = n - 1;
  var vals = ser.map(function (r) { return r.score; });
  var dates = ser.map(function (r) { return r.date; });
  var mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals);
  var maxI = vals.indexOf(mx), minI = vals.indexOf(mn);
  var mean = isNum(K.mean) ? K.mean : vals.reduce(function (a, b) { return a + b; }, 0) / n;
  var data = vals.map(function (v, i) {
    var it = { value: v };
    if (i === maxI) {
      it.symbol = "circle"; it.symbolSize = 10; it.itemStyle = { color: COLORS.red, borderColor: "#fff", borderWidth: 2 };
      it.label = { show: true, position: "top", distance: 8, color: COLORS.red, fontSize: 12.5, fontWeight: 700,
        align: i >= n - 3 ? "right" : i <= 1 ? "left" : "center", formatter: fmtNum(v, 1) + " · 区间最高" };
    }
    if (i === minI) {
      it.symbol = "circle"; it.symbolSize = 10; it.itemStyle = { color: COLORS.green, borderColor: "#fff", borderWidth: 2 };
      it.label = { show: true, position: "bottom", distance: 8, color: COLORS.green, fontSize: 12.5, fontWeight: 700,
        align: i >= n - 3 ? "right" : i <= 1 ? "left" : "center", formatter: fmtDay(dates[i]) + " · " + fmtNum(v, 1) };
    }
    if (i === last) {
      var also = i === maxI ? "{s|区间最高}" : "";
      it.symbol = "circle"; it.symbolSize = 12;
      it.itemStyle = { color: i === minI ? COLORS.green : COLORS.red, borderColor: "#fff", borderWidth: 2 };
      if (i !== minI) {
        it.label = { show: true, position: "top", distance: 12, align: "right", offset: [12, 0], backgroundColor: "rgba(255,253,249,0.82)", padding: [0, 4], borderRadius: 4,
          formatter: "{b|今日 " + fmtNum(v, 1) + "}" + (also ? "\n" + also : ""),
          rich: { b: { fontSize: narrow ? 18 : 24, fontWeight: 800, color: COLORS.red, lineHeight: narrow ? 24 : 30 }, s: { fontSize: 12, fontWeight: 700, color: COLORS.red, align: "right" } } };
      }
    }
    return it;
  });
  return {
    animation: true,
    grid: { left: 36, right: narrow ? 22 : 30, top: 56, bottom: 28 },
    tooltip: { trigger: "axis", formatter: function (ps) {
      var p = ps.filter(function (x) { return x.seriesType === "line"; })[0] || ps[0];

    } },
    xAxis: { type: "category", data: dates, axisTick: { show: false }, axisLine: { lineStyle: { color: "#ddd3c4" } },
      axisLabel: { color: AXIS_TXT, fontSize: 11, formatter: function (v) { return fmtDay(v); }, hideOverlap: true } },
    yAxis: [
      { type: "value", min: Math.max(0, Math.floor((mn - 6) / 10) * 10), max: Math.min(100, Math.ceil((mx + 12) / 10) * 10),
        axisLabel: { color: AXIS_TXT, fontSize: 11 }, splitLine: { lineStyle: { color: GRID_LN } }, axisLine: { show: false } },
      { type: "value", show: false, min: 0, max: 1 }
    ],
    series: [
      { type: "bar", yAxisIndex: 1, barWidth: "100%", barCategoryGap: "0%", silent: true, z: 0, tooltip: { show: false },
        data: vals.map(function (_, i) { return i === last ? { value: 1, itemStyle: { color: "rgba(224,138,42,0.16)" } } : null; }) },
      { type: "line", z: 3, data: data, symbol: "circle", symbolSize: 5, smooth: false,
        lineStyle: { width: 2.4, color: COLORS.orange }, itemStyle: { color: COLORS.orange },
        areaStyle: areaGrad(COLORS.orange),
        markLine: { silent: true, symbol: "none", lineStyle: { type: "dashed", color: COLORS.grey, width: 1.2 },
          label: { position: "insideStartTop", color: COLORS.grey, fontSize: 11.5, backgroundColor: "rgba(255,253,249,0.85)", padding: [1, 4], borderRadius: 3, formatter: "30 日均值 " + fmtNum(mean, 1) },
          data: [{ yAxis: mean }] } }
    ]
  };
}

/* ================= bootstrap ================= */
/* Add new page sections by appending a renderer(root) to SECTIONS .
   Order = page order; the footer is always rendered last. Each renderer is isolated by try/catch. */
var SECTIONS = [renderConclusions, renderLiquidity, renderSector, renderTeam, renderRetail];

(function () {
  var app = document.getElementById("app");
  if (!DATA) { app.appendChild(el("p", "muted", "未注入数据（请通过 build.py 生成页面）")); return; }
  if (DATA.meta && DATA.meta.demo) document.getElementById("demo-banner").style.display = "block";
  function safe(fn) {
    try { fn(app); flushCharts(); }
    catch (e) {
      if (window.console) console.error(e);
      app.appendChild(el("div", "card empty-note", "该部分渲染失败：" + (e && e.message ? e.message : e)));
    }
  }
  safe(renderHeader);
  SECTIONS.forEach(safe);
  safe(renderFooter);
})();
</script>
