name: build

on:
  schedule:
    - cron: "30 8 * * 1-5"
    - cron: "30 12 * * 1-5"
    - cron: "30 1 * * 2-6"  # 09:30 北京时间，周二至周六 = 每个交易日（周一至周五）的「次日早晨」补跑
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python build.py --out site/index.html
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
