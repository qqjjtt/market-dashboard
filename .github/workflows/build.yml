name: build

on:
  schedule:
    # 每个工作日北京时间 12:30 和 21:00 各构建一次。GitHub 定时对本仓库实测会晚 6～7.5 小时，且时晚时不晚，
    # 所以每个时段放一条「按时」的 cron 和几条「提前约 7 小时」的 cron；gate job 只让落进时段窗口
    # （12:20–14:30、20:50–23:30）且本时段还没构建过的那一次往下跑，其余直接跳过（几秒结束）
    - cron: "23 4 * * 1-5"  # 12:23 北京时间（12:30 时段，按时到达时用）
    - cron: "37,7 21-22 * * 0-4"  # 05:07、05:37、06:07、06:37 北京时间（12:30 时段，晚到约 7 小时时用）
    - cron: "53 12 * * 1-5"  # 20:53 北京时间（21:00 时段，按时到达时用）
    - cron: "17,47 6-7 * * 1-5"  # 14:17、14:47、15:17、15:47 北京时间（21:00 时段，晚到约 7 小时时用）
  push:
    branches: [main]
    # 只改存档、日历存档、文档时不必重建。github-actions 用 GITHUB_TOKEN 推的存档提交按 GitHub 规则不会再触发构建，不会循环
    paths-ignore:
      - "history/**"
      - "data/eco_cal.json"
      - "db/**"  # 历史数据库的存档提交同样不重建
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

# pages 组一次只跑一个，等待中的只保留最新一个（旧的等待项会被新的取消）；每次构建都整页重建，所以无妨
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 定时闸门  # healthcheck.py 只用标准库；推送和手动触发直接放行
        id: gate
        run: python healthcheck.py --gate https://qqjjtt.github.io/market-dashboard/ --event "${{ github.event_name }}"

  build:
    needs: gate
    if: ${{ needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write  # 把当天数据存档提交回仓库
    outputs:
      status: ${{ steps.health.outputs.status }}
      generated_at: ${{ steps.health.outputs.generated_at }}
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python build.py --out site/index.html --archive history
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: 体检  # 永远 exit 0，不拦发布；结论写进运行页 Summary，供 verify job 使用
        id: health
        continue-on-error: true  # 体检：脚本自己不会失败，这里是保险，绝不因体检拦住存档和发布
        run: python healthcheck.py site/index.html --live-url https://qqjjtt.github.io/market-dashboard/
      - name: 存档当天数据与财经日历
        continue-on-error: true  # 存档失败不影响页面发布，运行页会出现黄色提示
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          for p in data/eco_cal.json db; do if [ -e "$p" ]; then git add "$p"; fi; done  # 日历存档、历史库还不存在时跳过
          if git diff --cached --quiet; then echo "存档无变化"; exit 0; fi
          git commit -q -m "data: 存档 $(git diff --cached --name-only | xargs -n1 basename | sed 's/\.json$//' | paste -sd ' ' -)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.build.result == 'success' }}  # deploy 失败时也要跑：线上不会更新，核对失败让运行标红
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 上线核对  # healthcheck.py 只用标准库，不装依赖
        run: >-
          python healthcheck.py
          --verify-live https://qqjjtt.github.io/market-dashboard/
          --expect-generated "${{ needs.build.outputs.generated_at }}"
          --status "${{ needs.build.outputs.status }}"
