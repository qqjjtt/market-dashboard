name: build

on:
  schedule:
    # GitHub 繁忙时会跳过或延迟定时任务，整点和半点最拥挤，所以都避开；每个时段再补跑一次
    - cron: "37 13 * * 1-5"  # 工作日 21:37 北京时间（主；筹码数据 20–21 点才更新，此时基本已出）
    - cron: "43 14 * * 1-5"  # 工作日 22:43 北京时间（补跑：主被跳过时接上；两次都跑也只会覆盖同一天数据）
    - cron: "7 1 * * 1-5"  # 工作日 09:07 北京时间（主：补上前一晚美国数据）
    - cron: "13 2 * * 1-5"  # 工作日 10:13 北京时间（补跑）
  push:
    branches: [main]
    # 只改存档、日历存档、文档时不必重建。github-actions 用 GITHUB_TOKEN 推的存档提交按 GitHub 规则不会再触发构建，不会循环
    paths-ignore:
      - "history/**"
      - "data/eco_cal.json"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

# pages 组一次只跑一个，等待中的只保留最新一个（旧的等待项会被新的取消）；每次构建都整页重建，所以无妨
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write  # 把当天数据存档提交回仓库
    outputs:
      status: ${{ steps.health.outputs.status }}
      generated_at: ${{ steps.health.outputs.generated_at }}
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python build.py --out site/index.html --archive history
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: 体检  # 永远 exit 0，不拦发布；结论写进运行页 Summary，供 verify job 使用
        id: health
        continue-on-error: true  # 体检：脚本自己不会失败，这里是保险，绝不因体检拦住存档和发布
        run: python healthcheck.py site/index.html --live-url https://qqjjtt.github.io/market-dashboard/
      - name: 存档当天数据与财经日历
        continue-on-error: true  # 存档失败不影响页面发布，运行页会出现黄色提示
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history data/eco_cal.json || git add history  # 日历存档文件还不存在时，只存 history
          if git diff --cached --quiet; then echo "存档无变化"; exit 0; fi
          git commit -q -m "data: 存档 $(git diff --cached --name-only | xargs -n1 basename | sed 's/\.json$//' | paste -sd ' ' -)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  verify:
    needs: [build, deploy]
    if: ${{ !cancelled() && needs.build.result == 'success' }}  # deploy 失败时也要跑：线上不会更新，核对失败让运行标红
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 上线核对  # healthcheck.py 只用标准库，不装依赖
        run: >-
          python healthcheck.py
          --verify-live https://qqjjtt.github.io/market-dashboard/
          --expect-generated "${{ needs.build.outputs.generated_at }}"
          --status "${{ needs.build.outputs.status }}"
