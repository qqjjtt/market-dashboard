<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>涨停地图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap">
<style>
  :root {
    --bg: #ffffff; --surface: #f4f4f2; --ink: #1f2b4d; --muted: #646b81;
    --hair: color-mix(in oklab, var(--ink) 12%, transparent);
    --up: #c8402f; --down: #1f8a5b; --cold: #2f5d8a; --warm: #b8651a;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Geist", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 15px; line-height: 1.55;
  }
  a { color: inherit; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled, select:disabled { opacity: .45; cursor: not-allowed; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  [hidden] { display: none !important; }
  .up { color: var(--up); } .down { color: var(--down); }
  .num, .table, .kpi .v { font-variant-numeric: tabular-nums; }

  header.top { position: sticky; top: 0; z-index: 10; background: color-mix(in oklab, var(--bg) 94%, transparent);
               backdrop-filter: blur(6px); border-bottom: 1px solid var(--hair); }
  .bar { max-width: 1240px; margin: 0 auto; padding: 12px 20px 0; }
  .brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px 18px; flex-wrap: wrap; }
  .brand h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .meta, .note, small { color: var(--muted); }
  .meta { font-size: 13px; }
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .tools label { color: var(--muted); font-size: 13px; }
  .tools select, .tools input, #refresh, #prev, #next {
    font-size: 13px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--hair); border-radius: 6px; padding: 3px 8px; min-height: 30px;
  }
  #prev, #next { padding: 3px 10px; }
  nav { display: flex; gap: 2px; margin-top: 8px; overflow-x: auto; scrollbar-width: none; }
  nav::-webkit-scrollbar { display: none; }
  nav button {
    flex: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none;
    padding: 8px 14px 10px; color: var(--muted); font-weight: 550; font-size: 15px; min-height: 0; white-space: nowrap;
  }
  nav button:hover { color: var(--ink); }
  nav button[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 14px 20px 48px; }
  #status { margin: 0 0 4px; color: var(--muted); font-size: 13px; min-height: 1.4em; }
  #status.error { color: var(--up); }

  .kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); margin-top: 6px; }
  .kpi { padding: 6px 16px; border-right: 1px solid var(--hair); min-width: 0; }
  .kpi:first-child { padding-left: 0; }
  .kpi:last-child { border-right: 0; }
  .kpi .n { color: var(--muted); font-size: 13px; }
  .kpi .v { font-size: 22px; font-weight: 650; line-height: 1.25; margin-top: 2px; }
  .kpi .v small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .kpi .d { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }

  .sec-title { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; margin: 28px 0 10px; }
  .sec-title h2 { margin: 0; font-size: 16px; font-weight: 650; }
  .sec-title small { font-size: 13px; font-weight: 400; }
  .sec-title .tools { margin-left: auto; }
  .subhead { margin: 14px 0 8px; font-size: 15px; font-weight: 650; }
  .note { margin: 0 0 8px; font-size: 13px; }
  .note .inline { font-weight: 600; }

  .rates { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 2px 0 12px; }
  .rates button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 4px 0; color: var(--muted); min-height: 0; }
  .rates button.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 650; }

  .scroll { overflow-x: auto; }
  .table { width: 100%; border-collapse: collapse; font-size: 14px; white-space: nowrap; }
  .table th, .table td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--hair); }
  .table th { color: var(--muted); font-weight: 500; font-size: 13px; }
  .table th:first-child, .table td:first-child, .table .left { text-align: left; }
  .table tbody tr:hover { background: var(--surface); }
  .table .inline, .inline { border: 0; background: none; padding: 0; min-height: 0; color: var(--ink); font-weight: 600; text-align: left; }
  .table .inline:hover, .inline:hover { text-decoration: underline; text-underline-offset: 3px; }
  .rank { margin: 22px 0 4px; }
  .rank h2 { margin: 0; font-size: 20px; font-weight: 650; }
  .rank .lead { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .rank ol { list-style: none; margin: 10px 0 0; padding: 0; }
  .rank li { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: baseline; gap: 4px 14px; padding: 9px 0; border-top: 1px solid var(--hair); break-inside: avoid; }
  .rank li.on { background: var(--surface, #f4f5f8); box-shadow: inset 3px 0 0 var(--up); padding-left: 6px; }
  .rank .more { margin-top: 8px; border: 1px solid var(--hair); border-radius: 6px; background: none; padding: 6px 14px; font: inherit; font-size: 13px; color: inherit; cursor: pointer; }
  #ladder-head { scroll-margin-top: 140px; }
  @media (min-width: 900px) { .rank ol { columns: 2; column-gap: 40px; } }
  .rank .i { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  .rank .nm { font-size: 16px; font-weight: 650; }
  .rank .sub { display: block; margin-top: 1px; color: var(--muted); font-size: 13px; font-weight: 400; }
  .rank .ct { font-size: 20px; font-weight: 650; color: var(--up); line-height: 1; font-variant-numeric: tabular-nums; }
  .rank .ct small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .rank li.top .nm { font-size: 22px; }
  .rank li.top .ct { font-size: 32px; }
  .rank li.mid .nm { font-size: 18px; }
  .rank li.mid .ct { font-size: 26px; }
  .table td { font-size: 13px; color: var(--muted); }
  .table td.name { font-size: 15px; color: var(--ink); }
  .table td .num.up, .table td .num.down { font-size: 15px; font-weight: 650; }
  .group td { background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 650; padding: 10px 10px; }
  .group:hover td { background: var(--surface); }
  .group .fold { color: var(--ink); font-weight: 650; font-size: 16px; min-height: 0; padding: 0; }
  .group .fold::before { content: "▸  "; }
  .group .fold[aria-expanded="true"]::before { content: "▾  "; }
  .name { font-weight: 650; }
  .empty { color: var(--muted); padding: 16px 0; }
  .heat { text-align: center; }
  .heat button {
    display: block; width: 100%; min-width: 34px; min-height: 26px; margin: 0; padding: 3px 2px;
    border: 0; border-radius: 3px; color: var(--ink); font-weight: 550;
    background: color-mix(in oklab, var(--up) calc(var(--heat, 0) * 100%), #fff);
  }
  .heat button:hover { box-shadow: inset 0 0 0 1px var(--hair); }
  .sticky-col th:first-child, .sticky-col td:first-child { position: sticky; left: 0; background: var(--bg); }
  .sticky-col tbody tr:hover td:first-child { background: var(--surface); }
  .sticky-col .group td:first-child { background: var(--surface); }

  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 32px; align-items: start; }
  .chart { display: block; width: 100%; min-width: 280px; height: auto; }
  .chart text { fill: var(--muted); font: 11px "Geist", "PingFang SC", sans-serif; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin: 0 0 4px; }
  .legend span:before { content: ""; display: inline-block; width: 10px; height: 2px; background: var(--tone); margin-right: 6px; vertical-align: middle; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; }
  .chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--surface); color: var(--muted); }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(108px, 1fr)); }
  .metrics div { padding: 8px 12px 8px 0; }
  .metrics small { color: var(--muted); }
  .metrics b { display: block; font-size: 18px; font-weight: 650; }

  details.more { margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--hair); color: var(--muted); font-size: 13px; }
  details.more summary { cursor: pointer; color: var(--ink); font-weight: 650; font-size: 15px; }
  details.more p { margin: 8px 0; }

  .dialog { width: min(860px, calc(100vw - 24px)); max-height: 90vh; padding: 0; color: var(--ink);
            background: var(--bg); border: 1px solid var(--hair); border-radius: 8px; }
  .dialog::backdrop { background: rgba(31, 43, 77, .28); }
  .dialog-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--hair); }
  .dialog h2 { margin: 0; font-size: 16px; }
  .dialog-head button { border: 1px solid var(--hair); border-radius: 6px; background: var(--bg); padding: 3px 10px; min-height: 30px; }
  .dialog-body { padding: 14px 16px 18px; }
  .dialog-body h3 { margin: 16px 0 8px; font-size: 15px; }

  @media (max-width: 980px) {
    .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .kpi:nth-child(3) { border-right: 0; }
    .kpi:nth-child(-n+3) { padding-bottom: 12px; }
    .kpi:nth-child(3n+1) { padding-left: 0; }
    .split { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi:nth-child(3) { border-right: 1px solid var(--hair); }
    .kpi:nth-child(2n) { border-right: 0; }
    .kpi:nth-child(3n+1) { padding-left: 16px; }
    .kpi:nth-child(2n+1) { padding-left: 0; }
    .kpi:nth-child(-n+4) { padding-bottom: 12px; }
    .kpi .v { font-size: 20px; }
    nav button { padding: 8px 10px; font-size: 14px; }
  }
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="brand">
      <h1>涨停地图</h1>
      <div class="tools">
        <button id="prev" aria-label="上一交易日">←</button>
        <label>交易日<select id="date" aria-label="交易日"></select></label>
        <button id="next" aria-label="下一交易日">→</button>
        <label>回看<select id="days" aria-label="回看窗口"><option value="5">5 日</option><option value="10">10 日</option><option value="15" selected>15 日</option><option value="20">20 日</option><option value="30">30 日</option><option value="40">40 日</option></select></label>
        <button id="refresh" type="button">更新数据</button>
      </div>
    </div>
    <span id="stamp" class="meta">读取中</span>
    <nav aria-label="分析模块">
      <button data-tab="ladder" aria-pressed="true">连板天梯</button>
      <button data-tab="industry" aria-pressed="false">行业 × 身位</button>
      <button data-tab="cross" aria-pressed="false">行业 × 题材</button>
      <button data-tab="promotion" aria-pressed="false">晋级接力</button>
      <button data-tab="history" aria-pressed="false">多日轮动</button>
    </nav>
  </div>
</header>
<main class="wrap">
<p id="status" role="status" aria-live="polite">正在读取盘后数据…</p>
<div id="main" hidden>
  <div id="kpis" class="kpis"></div>
  <div id="view"></div>
  <details class="more"><summary>数据范围与口径</summary><p id="scope"></p><p>申万行业用最新成分映射，不代表历史时点分类。题材来自开盘啦，一只股票可以同时属于多个题材，各题材的家数和金额不能相加。</p><p>涨停成交额是这些股票当天的成交额，不是净流入。封单额是挂单金额。晋级指同一只股票连续两个交易日收盘涨停，且连板高度加一。</p><p>数据来自 Tushare 涨跌停列表、开盘啦和申万行业。只供复盘，不构成投资建议。</p></details>
</div>
</main>
<dialog id="detail" class="dialog" aria-labelledby="detail-title"><div class="dialog-head"><h2 id="detail-title"></h2><form method="dialog"><button aria-label="关闭详情">关闭</button></form></div><div class="dialog-body" id="detail-body"></div></dialog>
<script id="initial" type="application/json">/*__LIMIT_DATA__*/null</script>
<script>
'use strict';
const $=id=>document.getElementById(id), state={data:null,tab:'ladder',pool:'up',tier:'all',level:'L2',metric:'count',rotation:'sw_l2_rotation',positionMetric:'count',query:'',sector:'',concept:'',order:'up_count',promo:0,rankAll:false,fold:{'首板':true,'2 连板':true}};
const staticMode=!/^https?:$/.test(location.protocol)||/*__LIMIT_SNAPSHOT__*/false;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=0)=>Number.isFinite(v)?v.toLocaleString('zh-CN',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
const signed=v=>Number.isFinite(v)?`<span class="num ${v>0?'up':v<0?'down':''}">${v>0?'+':''}${fmt(v,2)}%</span>`:'—';
const rate=(v,d=1)=>Number.isFinite(v)?`${fmt(v,d)}%`:'—';
const dateFmt=v=>String(v??'').replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3');
const option=(v,n,cur)=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(n)}</option>`;
const btn=(n,kind,value)=>`<button class="inline" data-${kind}="${esc(value)}">${esc(n)}</button>`;
const empty=(msg='没有符合条件的数据')=>`<div class="empty">${esc(msg)}</div>`;
const section=(title,desc,controls='')=>`<header class="sec-title"><h2>${title}</h2>${desc?`<small>${desc}</small>`:''}${controls?`<div class="tools">${controls}</div>`:''}</header>`;
const select=(label,id,opts,current)=>`<label>${label}<select id="${id}">${opts.map(([v,n])=>option(v,n,current)).join('')}</select></label>`;
const td=(html,klass='')=>`<td class="${klass}">${html}</td>`;
const table=(headers,rows,cls='',label='数据明细')=>rows.length?`<div class="scroll" tabindex="0" aria-label="${label}"><table class="table ${cls}"><thead><tr>${headers.map(h=>`<th scope="col">${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:empty();
const stockName=s=>`${btn(s.name||s.ts_code,'stock',s.ts_code)} <small class="num">${esc(s.ts_code)}</small>`;
const height=s=>s.limit==='U'?(s.limit_times===1?'首板':Number.isFinite(s.limit_times)?`${s.limit_times} 连板`:'高度未知'):s.limit==='Z'?'炸板':'跌停';
function foldClosed(label){if(state.query.trim()||state.tier==='3+'||state.sector||state.concept)return false;if((state.tier==='1'&&label==='首板')||(state.tier==='2'&&label==='2 连板'))return false;return label in state.fold?!!state.fold[label]:label==='首板'||label==='2 连板';}
function stockTable(rows,group=false){let previous=null,fold=null;const body=[];for(const s of rows){const h=height(s);if(group&&previous!==h){const n=rows.filter(x=>height(x)===h).length,closed=foldClosed(h);fold=h;const label=`${esc(h)} · ${fmt(n)} 家`;body.push(`<tr class="group"><td colspan="9"><button type="button" class="fold" data-fold="${esc(h)}" aria-expanded="${closed?'false':'true'}">${label}</button></td></tr>`);previous=h;}const hide=group&&fold&&foldClosed(fold);body.push(`<tr${group&&fold?` data-fold-row="${esc(fold)}"`:''}${hide?' hidden':''}>`+td(stockName(s),'name')+td(esc(h)+(s.is_trend?` <small>${esc(s.stat_label)}</small>`:''))+td(esc(s.sw_l2),'left')+td(esc((s.concepts||[]).join('、')||'—'),'left')+td(signed(s.pct_chg))+td(esc(s.first_time||'—'),'num')+td(fmt(s.fd_yi,2),'num')+td(fmt(s.amount_yi,2),'num')+td(rate(s.turnover,2),'num')+'</tr>');}return table(['股票','身位 / 状态','申万二级','题材','涨跌幅','首次触板','封单额 / 亿','成交额 / 亿','换手率'],body,'','个股明细');}
function renderKpis(){const o=state.data.overview,p=state.data.promotion;const data=[['涨停',fmt(o.up_count),'家',`首板 ${fmt(o.b1_count)} / 二板 ${fmt(o.b2_count)}`,'up'],['最高连板',fmt(o.max_board),'板',(o.top_leaders||[]).map(x=>x.name).join('、')||'—',''],['连板股',fmt(o.multi_count),'家',`三板 ${fmt(o.b3_count)} / 四板+ ${fmt(o.b4p_count)}`,''],['收盘封板率',rate(o.seal_rate),'',`炸板 ${fmt(o.zha_count)} / 跌停 ${fmt(o.down_count)}`,''],['昨板晋级率',rate(p.overall_promo_rate),'',`${fmt(p.promoted_count)} / ${fmt(p.prev_count)} 家`,''],['涨停股成交',fmt(o.up_amount_yi,1),'亿',`收盘封单 ${fmt(o.fd_yi,1)} 亿`,'']];$('kpis').innerHTML=data.map(([l,v,u,n,cl])=>`<div class="kpi"><div class="n">${l}</div><div class="v ${cl}">${v}${u?`<small>${u}</small>`:''}</div><div class="d">${esc(n)}</div></div>`).join('');}
function ladderList(){const d=state.data,q=state.query.trim().toLowerCase();return (d.stocks[state.pool]||[]).filter(s=>(state.pool!=='up'||state.tier==='all'||(state.tier==='3+'?s.limit_times>=3:String(s.limit_times)===state.tier))&&(!state.sector||s.sw_l2===state.sector)&&(!state.concept||(s.concepts||[]).includes(state.concept))&&(!q||`${s.name} ${s.ts_code} ${s.sw_l2} ${(s.concepts||[]).join(' ')}`.toLowerCase().includes(q)));}
const RANK_TOP=12;function sectorRank(rows){const list=(rows||[]).filter(r=>r.up_count>0&&r.name&&r.name!=='未分类');if(!list.length)return '';const picked=list.findIndex(r=>r.name===state.sector),shown=state.rankAll||list.length<=RANK_TOP+3?list:list.slice(0,Math.max(RANK_TOP,picked+1));const items=shown.map((r,i)=>{const height=r.max_board>1?`最高 ${r.max_board} 连板`:r.max_board===1?'首板':'';const sub=[height,r.leader?.name,r.multi_count?`连板 ${fmt(r.multi_count)} 家`:''].filter(Boolean).join(' · ');return `<li class="${i<1?'top':i<3?'mid':''}${r.name===state.sector?' on':''}"><span class="i">${String(i+1).padStart(2,'0')}</span><span><button type="button" class="inline nm" data-sector="${esc(r.name)}">${esc(r.name)}</button>${sub?`<span class="sub">${esc(sub)}</span>`:''}</span><b class="ct">${fmt(r.up_count)}<small>家</small></b></li>`;}).join('');return `<section class="rank" aria-label="有涨停的板块"><h2>有涨停的板块</h2><p class="lead">申万二级，共 ${fmt(list.length)} 个，按涨停家数从多到少。点名称只看该板块的个股。</p><ol>${items}</ol>${shown.length<list.length?`<button type="button" class="more" data-rankall="1">展开其余 ${fmt(list.length-shown.length)} 个板块</button>`:state.rankAll&&list.length>RANK_TOP+3?`<button type="button" class="more" data-rankall="0">收起</button>`:''}</section>`;}
function renderLadder(){const d=state.data;const opts=xs=>[['','全部'],...Array.from(new Set(xs.filter(Boolean))).sort((a,b)=>a.localeCompare(b,'zh')).map(x=>[x,x])];const all=Object.values(d.stocks).flat();const filters=select('池','pool',[['up','收盘涨停'],['zha','炸板'],['down','跌停']],state.pool)+(state.pool==='up'?select('身位','tier',[['all','全部'],['1','首板'],['2','二板'],['3+','三板及以上']],state.tier):'')+select('申万二级','sector',opts(all.map(s=>s.sw_l2)),state.sector)+select('题材','concept',opts(all.flatMap(s=>s.concepts||[])),state.concept)+`<input id="query" type="search" aria-label="搜索股票或概念" placeholder="搜索代码、名称…" value="${esc(state.query)}">`;
return sectorRank(d.sw_matrix.L2)+`<div id="ladder-head"></div>`+section('连板天梯',state.sector?`只看「${esc(state.sector)}」，再点一次板块名称取消。`:'点档位标题展开或收起。')+`<div class="tools">${filters}</div><div id="stock-results">${stockTable(ladderList(),state.pool==='up')}</div>`;}
function levels(id){return select('申万层级',id,[['L1','一级'],['L2','二级'],['L3','三级']],state.level);}
function renderIndustry(){const rows=[...state.data.sw_matrix[state.level]].sort((a,b)=>(b[state.order]??-Infinity)-(a[state.order]??-Infinity));const measure=state.positionMetric,units={count:'家',amount_yi:'成交 / 亿',fd_yi:'封单 / 亿'}[measure];const controls=levels('level')+select('身位指标','positionMetric',[['count','涨停家数'],['amount_yi','成交额'],['fd_yi','封单额']],measure)+select('排序','order',[['up_count','涨停家数'],['multi_count','连板家数'],['max_board','最高板'],['up_amount_yi','涨停成交额'],['fd_yi','涨停封单额']],state.order);return section('行业 × 身位','点行业查看成分。',controls)+table(['申万行业',`首板 / ${units}`,`二板 / ${units}`,`三板 / ${units}`,`四板+ / ${units}`,'涨停','炸板','最高板','涨停成交 / 亿','封单 / 亿','行业指数','涨停成交占行业比'],rows.map((r,i)=>`<tr>${td(btn(r.name,'industry',i),'name')}${['b1','b2','b3','b4p'].map(k=>td(fmt(measure==='count'?r[k]:r.board_capital?.[k]?.[measure],measure==='count'?0:2),'num')).join('')}${[r.up_count,r.zha_count,r.max_board].map(x=>td(fmt(x),'num')).join('')}${td(fmt(r.up_amount_yi,2),'num')}${td(fmt(r.fd_yi,2),'num')}${td(signed(r.index_pct))}${td(rate(r.amt_concentration),'num')}</tr>`),'sticky-col','行业与身位矩阵');}
function renderCross(){const d=state.data,m=d.cross_matrix.levels?.[state.level]??(state.level==='L2'?d.cross_matrix:{}),rs=m.industry_list??m.sw_l2_list??[],cs=m.concept_list??[];if(!cs.length)return section('行业 × 题材','点格子看交集个股。题材重叠，不能跨列相加。')+empty(`${d.overview?.trade_date_fmt??d.meta.trade_date_fmt} 的开盘啦题材数据暂缺（kpl_list 未返回或未缓存），行业 × 题材交叉无法计算。涨停、炸板与连板统计不受影响；盘后数据更新后点「更新数据」重试。`);const key=(a,b)=>JSON.stringify([a,b]);const cells=new Map((m.cells||[]).map((x,i)=>[key(x.industry??x[`sw_${state.level.toLowerCase()}`]??x.sw_l2,x.concept),[x,i]]));const mf={count:[0,'涨停家数'],amount_yi:[2,'成交额 / 亿'],fd_yi:[2,'封单额 / 亿']}[state.metric];const max=Math.max(1,...Array.from(cells.values(),([c])=>c[state.metric]??0));const rows=rs.map(r=>`<tr>${td(`${esc(r.name)} <small>${fmt(r.total)}</small>`,'name')}${cs.map(c=>{const pair=cells.get(key(r.name,c.name));if(!pair)return td('·','heat');const [item,i]=pair,v=item[state.metric];return td(`<button data-cross="${i}" style="--heat:${Math.max(0,Math.min(.43,.06+.37*(v??0)/max))}" aria-label="${esc(r.name+' × '+c.name)}">${fmt(v,mf[0])}</button>`,'heat num');}).join('')}</tr>`);const list=d.concepts.slice(0,15).map((r,i)=>`<tr>${td(btn(r.name,'theme',i),'name')}${td(fmt(r.up_count))}${td(fmt(r.multi_count))}${td(fmt(r.max_board))}${td(fmt(r.up_amount_yi,2))}${td(fmt(r.fd_yi,2))}</tr>`);return section('行业 × 题材','点格子看交集个股。题材重叠，不能跨列相加。',levels('level')+select('热力口径','metric',Object.entries({count:'涨停家数',amount_yi:'成交额',fd_yi:'封单额'}),state.metric))+table([`行业 / ${mf[1]}`,...cs.map(c=>esc(c.name))],rows,'sticky-col','行业与热门题材交叉矩阵')+section('题材排行','按涨停家数排列。')+table(['题材','涨停','连板','最高板','成交 / 亿','封单 / 亿'],list);}
function renderPromotion(){const p=state.data.promotion,ts=p.tiers||[],i=Math.min(state.promo,Math.max(0,ts.length-1)),t=ts[i];const tiers=ts.map((x,j)=>`<button type="button" class="${j===i?'on':''}" data-promo="${j}">${esc(x.label)} <b class="num">${rate(x.rate)}</b> <small>${fmt(x.success_count)}/${fmt(x.prev_count)}</small></button>`).join('');const rows=t?[...t.success,...t.failed].map(s=>`<tr>${td(esc(s.name)+' <small>'+esc(s.ts_code)+'</small>','name')}${td(fmt(s.prev_boards))}${td(s.promoted?'<b>晋级</b>':s.is_zha?'炸板':s.today_boards>0?'未达晋级条件':'未晋级')}${td(fmt(s.today_boards))}${td(signed(s.today_pct))}${td(signed(s.today_open_pct))}${td(esc(s.sw_l2),'left')}</tr>`):[];return section('晋级接力','对比相邻两个交易日的同一只股票。')+`<p class="note">昨日涨停今日平均涨跌 ${signed(p.avg_pct_chg)} · 上一交易日 ${esc(state.data.overview.prev_date_fmt??'—')}</p>`+(tiers?`<div class="rates">${tiers}</div>`:empty('缺少上一交易日或连板数据'))+`<h3 class="subhead">${esc(t?.label??'晋级明细')}</h3>`+table(['股票','昨日高度','结果','今日高度','今日涨跌','开盘溢价','申万二级'],rows);}
function chart(rows,series,max,caption){const W=800,H=170,X=42,end=780,Y=12,bot=142,n=Math.max(rows.length-1,1);const x=i=>X+i*(end-X)/n,y=v=>bot-(bot-Y)*v/max;let body='';for(let j=0;j<=4;j++){const v=j*max/4;body+=`<path d="M${X} ${y(v)}H${end}" stroke="#d9dce6"/><text x="5" y="${y(v)+3}">${fmt(v,max<=5?1:0)}</text>`;}const step=Math.max(1,Math.ceil(rows.length/10));rows.forEach((r,i)=>{if(i%step===0||i===rows.length-1)body+=`<text text-anchor="middle" x="${x(i)}" y="160">${esc(r.date_md)}</text>`;});for(const [key,label,color] of series){let path='',prev=false;rows.forEach((r,i)=>{const v=r[key];if(!Number.isFinite(v)){prev=false;return;}path+=`${prev?'L':'M'}${x(i)} ${y(v)} `;prev=true;body+=`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${color}"><title>${esc(`${r.date_md} ${label} ${fmt(v,1)}`)}</title></circle>`;});body=`<path d="${path}" fill="none" stroke="${color}" stroke-width="1.6"/>`+body;}return `<div><div class="legend">${series.map(([,l,c])=>`<span style="--tone:${c}">${l}</span>`).join('')}</div><div class="scroll"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${caption}">${body}</svg></div></div>`;}
function renderHistory(){const h=state.data.history,ds=h.daily,rot=h[state.rotation]||[];const max=Math.max(1,...rot.flatMap(r=>r.series).filter(Number.isFinite));const rRows=rot.map(r=>`<tr>${td(esc(r.name)+' <small>'+fmt(r.total)+'</small>','name')}${r.series.map((v,i)=>td(`<button data-day="${esc(h.dates[i])}" ${staticMode?'disabled':''} style="--heat:${v>0?.06+.4*v/max:0}" aria-label="${esc(r.name+' '+dateFmt(h.dates[i]))}：${fmt(v)} 家">${v===0?'·':fmt(v)}</button>`,'heat num')).join('')}</tr>`);const dRows=[...ds].reverse().map(r=>`<tr>${td(staticMode?dateFmt(r.date):btn(dateFmt(r.date),'day',r.date),'num')}${td(fmt(r.up_count))}${td(fmt(r.zha_count))}${td(fmt(r.b1))}${td(fmt(r.b2))}${td(fmt(r.max_board))}${td(rate(r.promo_rate))}${td(rate(r.b1_to_b2_rate))}${td(rate(r.b2_to_b3_rate))}${td(esc(r.leader_names??'—'),'left')}</tr>`);const col=['#c8402f','#2f5d8a','#1f8a5b'];return section('多日走势','不跨缺失日期连线。点交易日回到当日。')+`<div class="split">${chart(ds,[['max_board','最高连板',col[0]]],Math.max(4,...ds.map(r=>r.max_board??0)),'最高连板高度趋势')}${chart(ds,[['promo_rate','总晋级率 %',col[0]],['b1_to_b2_rate','一进二 %',col[1]],['b2_to_b3_rate','二进三 %',col[2]]],100,'晋级率趋势')}</div>`+section('轮动','一格是当天的涨停家数。',select('维度','rotation',[['sw_l2_rotation','申万二级'],['sw_l1_rotation','申万一级'],['concept_rotation','热门题材']],state.rotation))+table(['分类 / 区间家次',...h.dates_md],rRows,'sticky-col','轮动热力表')+section('逐日','由近到远。')+table(['交易日','涨停','炸板','首板','二板','最高板','总晋级','一进二','二进三','最高板个股'],dRows);}
const renderers={ladder:renderLadder,industry:renderIndustry,cross:renderCross,promotion:renderPromotion,history:renderHistory};
function renderView(){for(const b of document.querySelectorAll('[data-tab]'))b.setAttribute('aria-pressed',String(b.dataset.tab===state.tab));$('view').innerHTML=renderers[state.tab]();}
function controls(busy=false){const m=state.data?.meta,d=m?.available_dates??[],i=d.indexOf(m?.trade_date);$('date').disabled=busy||staticMode;$('days').disabled=busy||staticMode;$('prev').disabled=busy||staticMode||i<0||i>=d.length-1;$('next').disabled=busy||staticMode||i<=0;$('refresh').disabled=busy||staticMode;}
function status(text,error=false){$('status').textContent=text;$('status').classList.toggle('error',error);}
function setDays(value){const n=Number(value);if(!Number.isInteger(n)||n<5||n>40)return;const s=$('days');if(![...s.options].some(o=>Number(o.value)===n))s.add(new Option(`${n} 日`,String(n)));s.value=String(n);}
function accept(data){state.data=data;const m=data.meta;const ds=staticMode?[m.trade_date]:Array.from(new Set([...(m.available_dates||[]),m.trade_date])).sort().reverse();$('date').innerHTML=ds.map(d=>option(d,dateFmt(d),m.trade_date)).join('');$('stamp').textContent=`交易日 ${m.trade_date_fmt} · ${staticMode?'离线快照':m.offline?'本地缓存':'盘后数据'}`;$('scope').textContent=m.source_scope||'基准涨停、炸板与跌停以 Tushare limit_list_d 覆盖范围为准；题材仅用于补充。';let note=staticMode?'离线快照。筛选和图表可用；换交易日和个股历史需要本地服务。':`数据日期 ${m.trade_date_fmt} · 回看 ${m.lookback_days} 个交易日`;
if(!staticMode&&m.latest_available_date&&m.trade_date!==m.latest_available_date)note+=` · 最新可查 ${dateFmt(m.latest_available_date)}`;
const gaps=data.history.daily.filter(x=>x.available===false).length;if(gaps)note+=` · 区间缺 ${gaps} 日`;
if(data.overview.available===false)note+=' · 所选交易日暂缺涨跌停数据';
if(data.overview.available!==false&&m.coverage?.kpl_up===false)note+=' · 题材数据暂缺';
else if(Number.isFinite(m.coverage?.limit_up_with_concepts)&&m.coverage.limit_up_with_concepts<data.overview.up_count)note+=` · 题材覆盖 ${m.coverage.limit_up_with_concepts}/${data.overview.up_count} 家涨停股`;
status(note);renderKpis();renderView();controls();$('main').hidden=false;}
let request=0;async function load(date,refresh=false){if(staticMode)return;const serial=++request;controls(true);status('正在读取盘后数据…');try{const q=new URLSearchParams({days:$('days').value});if(date)q.set('date',date);if(refresh)q.set('refresh','1');const r=await fetch('api/dashboard?'+q,{cache:'no-store'}),d=await r.json();if(serial!==request)return;if(!r.ok)throw Error(d.error||'读取失败');if(state.data?.meta.trade_date!==d.meta.trade_date){state.sector='';state.concept='';state.promo=0;}accept(d);if(date&&date!==d.meta.trade_date)status(`所选 ${dateFmt(date)} 暂无数据，当前显示 ${d.meta.trade_date_fmt}。`);}catch(e){if(serial!==request)return;if(state.data)$('date').value=state.data.meta.trade_date;status(`读取失败：${e.message}。可点击「更新数据」重试。`,true);}finally{if(serial===request)controls();}}
function open(title,body){$('detail-title').textContent=title;$('detail-body').innerHTML=body;if(!$('detail').open)$('detail').showModal();}
let detailSeq=0;
async function stockDetail(code){const d=state.data,s=Object.values(d.stocks).flat().find(x=>x.ts_code===code);if(!s)return;const id=++detailSeq;open(`${s.name} · ${s.ts_code}`,`<p>${esc([s.sw_l1,s.sw_l2,s.sw_l3].filter(Boolean).join(' / '))} <span class="chip">${esc(height(s))}</span></p><div class="chips">${(s.concepts||[]).map(c=>`<span class="chip">${esc(c)}</span>`).join('')}</div><div class="metrics">${[['涨跌幅',signed(s.pct_chg)],['成交额 / 亿',fmt(s.amount_yi,2)],['封单额 / 亿',fmt(s.fd_yi,2)],['换手率',rate(s.turnover,2)],['首次触板',esc(s.first_time)],['最后封板',esc(s.last_time)],['开板次数',fmt(s.open_times)]].map(([k,v])=>`<div><small>${k}</small><b class="num">${v}</b></div>`).join('')}</div><div id="stock-history"><p class="note">${staticMode?'本地服务下可查看近 30 个交易日的涨、炸、跌停记录。':'读取近 30 个交易日记录…'}</p></div>`);if(staticMode)return;try{const q=new URLSearchParams({code,date:d.meta.trade_date,days:'30'});const r=await fetch('api/stock?'+q),h=await r.json();if(!r.ok)throw Error(h.error);if(id!==detailSeq||!$('stock-history'))return;const rows=h.events.map(e=>`<tr>${td(btn(e.date_fmt,'day',e.trade_date),'num')}${td(esc(height(e)))}${td(signed(e.pct_chg))}${td(fmt(e.amount_yi,2))}${td(fmt(e.fd_yi,2))}</tr>`);$('stock-history').innerHTML=`<h3>近 ${fmt(h.window_days)} 个交易日触板记录</h3>`+table(['交易日','状态','涨跌幅','成交 / 亿','封单 / 亿'],rows);}catch(e){if(id===detailSeq&&$('stock-history'))$('stock-history').textContent='个股历史读取失败，请稍后重试。';}}
$('detail').addEventListener('close',()=>{if(!$('detail').open)detailSeq++;});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.fold){const open=b.getAttribute('aria-expanded')!=='true';state.fold[d.fold]=!open;b.setAttribute('aria-expanded',String(open));document.querySelectorAll('[data-fold-row]').forEach(tr=>{if(tr.dataset.foldRow===d.fold)tr.hidden=!open;});return;}if(d.tab){state.tab=d.tab;renderView();return;}if(d.day){if($('detail').open)$('detail').close();state.tab='ladder';load(d.day);window.scrollTo(0,0);return;}if(d.stock){stockDetail(d.stock);return;}if('promo'in d){state.promo=Number(d.promo);renderView();return;}if(d.rankall){state.rankAll=d.rankall==='1';renderView();return;}if(d.sector){state.pool='up';state.sector=state.sector===d.sector?'':d.sector;state.concept='';state.query='';state.tier='all';renderView();if(state.sector)$('ladder-head')?.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});return;}if('industry'in d){const r=[...state.data.sw_matrix[state.level]].sort((a,b)=>(b[state.order]??-Infinity)-(a[state.order]??-Infinity))[Number(d.industry)];open(`${r.name} · ${state.level}`,stockTable([...r.stocks,...r.zha_stocks]));return;}if('theme'in d){const r=state.data.concepts[Number(d.theme)];open(r.name,stockTable(r.stocks));return;}if('cross'in d){const m=state.data.cross_matrix.levels?.[state.level]??state.data.cross_matrix;const c=m.cells[Number(d.cross)];const codes=new Set(c.stocks.map(s=>s.ts_code));open(`${c.industry??c.sw_l2} × ${c.concept}`,stockTable(state.data.stocks.up.filter(s=>codes.has(s.ts_code))));}});
$('view').addEventListener('input',e=>{if(e.target.id==='query'){state.query=e.target.value;$('stock-results').innerHTML=stockTable(ladderList(),state.pool==='up');}});
$('view').addEventListener('change',e=>{const id=e.target.id;if(['pool','tier','sector','concept','level','order','metric','rotation','positionMetric'].includes(id)){state[id]=e.target.value;renderView();$(id)?.focus();}});
$('date').onchange=()=>load($('date').value);$('days').onchange=()=>load(state.data?.meta.trade_date);$('refresh').onclick=()=>load(null,true);
for(const [id,delta] of [['prev',1],['next',-1]])$(id).onclick=()=>{const ds=state.data.meta.available_dates,i=ds.indexOf(state.data.meta.trade_date),day=ds[i+delta];if(day)load(day);};
try{const params=new URLSearchParams(location.search);setDays(params.get('days')??document.body.dataset.days);const initial=JSON.parse($('initial').textContent.replace(/^\/\*__LIMIT_DATA__\*\//,''));if(initial)accept(initial);else if(!staticMode){const day=params.get('date')??document.body.dataset.date;load(day?.replaceAll('-',''));}else{controls();status('快照没有内嵌数据。',true);}}catch(e){status(`页面数据读取失败：${e.message}`,true);}
</script>
